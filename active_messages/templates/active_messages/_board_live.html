<script>
(function () {
  "use strict";
  var root = document.querySelector(".amb[data-status-url]");
  if (!root) return;
  // One submission per form: a double click never sends twice (the server is
  // idempotent anyway -- exact UUIDs, expected state/revision, request token).
  document.addEventListener("submit", function (event) {
    var form = event.target;
    if (!root.contains(form) || form.getAttribute("method") !== "post") return;
    if (form.dataset.sent) { event.preventDefault(); return; }
    form.dataset.sent = "1";
    form.querySelectorAll("button").forEach(function (button) { button.setAttribute("aria-disabled", "true"); });
  }, true);

  // Live status for a whole operator shift (D3E-D). Every ON AIR indication on
  // the page follows the server's one interpretation (the STARTED airing and
  // the messages frozen in ITS composition), on each successful refresh.
  //
  // * At most ONE request is outstanding: the next refresh is scheduled only
  //   after the previous one settled, and a forced refresh (tab shown again,
  //   page restored from the back-forward cache, the test hook) first aborts the
  //   outstanding one. A response -- success or failure -- may change the page
  //   only while its request is still the newest one sent, so an older answer
  //   is never applied and a failed newest request leaves the page stale until a
  //   later, newer success clears that.
  // * There is no polling cutoff: refreshes continue every EVERY ms while the tab
  //   is visible; after failures the delay doubles up to MAX_BACKOFF (a station
  //   outage is not hammered), and the first success restores the normal pace.
  // * Staleness is also a matter of age: no success for STALE_AFTER ms (a hidden,
  //   throttled or suspended tab) marks the page stale until a fresh answer.
  // * A hidden tab sends nothing; showing it refreshes at once if the last answer
  //   is older than EVERY.
  // * An expired session (401/403, a redirect to sign-in, or anything that is not
  //   the JSON status) stops refreshing and says so -- never retried in a loop.
  // * Rows are never re-rendered: expanded rows, focus, filters, typed input and
  //   the page position stay. A changed board version only offers a reload.
  var url = root.dataset.statusUrl, version = root.dataset.version;
  var EVERY = 20000, TIMEOUT = 10000, MAX_BACKOFF = 300000, STALE_AFTER = 3 * EVERY;
  var sent = 0, inflight = null, timer = null, failures = 0, stopped = false;
  var lastSuccess = Date.now(), applied = 0;
  var stale = document.getElementById("ambStale"), changed = document.getElementById("ambChanged");
  var expired = document.getElementById("ambExpired");
  document.querySelectorAll("[data-reload]").forEach(function (link) {
    link.href = window.location.pathname + window.location.search;
  });

  function text(selector, value) {
    var node = root.querySelector(selector);
    if (node && node.textContent !== String(value)) node.textContent = value;
  }
  function markStale(reason) {
    root.dataset.statusStale = "1";
    if (!stale) return;
    stale.querySelector("[data-stale-reason]").textContent = reason;
    stale.hidden = false;
  }
  function clearStale() {
    delete root.dataset.statusStale;
    if (stale) stale.hidden = true;
  }
  function apply(status) {
    clearStale();
    text('[data-count="urgent"]', status.urgent);
    text('[data-count="public_address"]', status.public_address);
    text('[data-count="review"]', status.review);
    var chip = document.getElementById("ambAiring");
    if (chip) {
      chip.classList.remove("onair", "alert");
      if (status.chip["class"]) chip.classList.add(status.chip["class"]);
      text('[data-text="airing"]', status.chip.text);
    }
    var worker = document.getElementById("ambWorker");
    if (worker && status.worker) {
      worker.classList.remove("ok", "review", "alert", "off");
      worker.classList.add(status.worker["class"]);
      worker.dataset.workerState = status.worker.state;
      text('[data-text="worker"]', status.worker.label);
    }
    var live = {};
    status.on_air.messages.forEach(function (id) { live[id] = true; });
    root.querySelectorAll("[data-onair-message]").forEach(function (node) {
      node.hidden = (node.dataset.onairWhen === "on") !== Boolean(live[node.dataset.onairMessage]);
    });
    root.querySelectorAll("li.amb-item[data-message]").forEach(function (item) {
      item.dataset.onAir = live[item.dataset.message] ? "true" : "false";
    });
    root.querySelectorAll("[data-execution-label]").forEach(function (node) {
      var id = node.dataset.executionLabel;
      if (status.on_air.execution === id) {
        node.textContent = "● On air"; node.dataset.shown = "onair";
      } else if (status.latest && status.latest.execution === id) {
        node.textContent = status.latest.label; node.dataset.shown = status.latest.state;
      } else if (node.dataset.shown === "onair") {
        node.textContent = "No longer on air (reload for its outcome)"; node.dataset.shown = "ended";
      }
    });
    if (changed && status.version !== version) changed.hidden = false;
    applied += 1;
  }
  function delay() {
    return failures ? Math.min(EVERY * Math.pow(2, failures), MAX_BACKOFF) : EVERY;
  }
  function schedule(ms) {
    window.clearTimeout(timer);
    timer = stopped ? null : window.setTimeout(tick, ms);
  }
  function tick() {
    timer = null;
    if (Date.now() - lastSuccess > STALE_AFTER) markStale("Live status is out of date");
    if (document.hidden) return;                       // resumed by visibilitychange
    poll();
  }
  function expire() {
    stopped = true;
    window.clearTimeout(timer);
    timer = null;
    markStale("Live status stopped");
    if (expired) expired.hidden = false;
  }
  function poll() {
    if (stopped) return Promise.resolve();
    if (inflight) inflight.abort();                    // never two outstanding requests
    var mine = ++sent;
    var abort = window.AbortController ? new AbortController() : null;
    inflight = abort;
    window.clearTimeout(timer);
    timer = null;
    var timeout = window.setTimeout(function () { if (abort) abort.abort(); }, TIMEOUT);
    return fetch(url, {credentials: "same-origin", cache: "no-store", headers: {"Accept": "application/json"},
                       signal: abort ? abort.signal : undefined})
      .then(function (response) {
        var type = response.headers.get("Content-Type") || "";
        if (response.status === 401 || response.status === 403 || response.redirected
            || (response.ok && type.indexOf("application/json") !== 0)) {
          var ended = new Error("session");
          ended.session = true;
          throw ended;
        }
        if (!response.ok) throw new Error("status " + response.status);
        return response.json();
      })
      .then(function (status) {
        if (mine !== sent) return;                     // superseded by a newer request: never applied
        failures = 0;
        lastSuccess = Date.now();
        apply(status);
      })
      .catch(function (error) {
        if (mine !== sent) return;
        if (error && error.session) { expire(); return; }
        failures += 1;
        markStale(failures > 1 ? "Live status could not be refreshed (retrying less often)"
                               : "Live status could not be refreshed");
      })
      .then(function () {
        window.clearTimeout(timeout);
        if (mine !== sent) return;
        inflight = null;
        if (!stopped && !document.hidden) schedule(delay());
      });
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden || stopped) return;
    if (Date.now() - lastSuccess > STALE_AFTER) markStale("Live status is out of date");
    if (inflight) return;                              // its completion schedules the next refresh
    if (Date.now() - lastSuccess >= EVERY || failures) poll();
    else schedule(EVERY - (Date.now() - lastSuccess));
  });
  window.addEventListener("pageshow", function (event) {
    if (!event.persisted) return;
    root.querySelectorAll("form[data-sent]").forEach(function (form) {
      delete form.dataset.sent;
      form.querySelectorAll("button").forEach(function (button) { button.removeAttribute("aria-disabled"); });
    });
    if (stopped) return;
    markStale("Restored page: checking live status");  // what the cache restored is old by definition
    poll();
  });
  schedule(EVERY);
  window.ambBoardStatus = {
    poll: poll,
    state: function () {
      return {sent: sent, failures: failures, stopped: stopped, inflight: Boolean(inflight), scheduled: Boolean(timer),
              applied: applied, stale: root.dataset.statusStale === "1", delay: delay()};
    }
  };
})();
</script>
