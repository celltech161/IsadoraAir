{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — IsadoraAir</title>
  <style>
    :root {
      --bg-dark: {{ ui_theme.bg_dark }};
      --bg-darker: {{ ui_theme.bg_darker }};
      --panel-bg: {{ ui_theme.panel_bg }};
      --accent: {{ ui_theme.accent }};
      --accent-soft: {{ ui_theme.accent_soft }};
      --text-main: {{ ui_theme.text_main }};
      --text-muted: {{ ui_theme.text_muted }};
      --danger: {{ ui_theme.danger }};
      --border-subtle: {{ ui_theme.border_subtle }};
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-darker);
      color: var(--text-main);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-card {
      width: 100%;
      max-width: 340px;
      background: var(--bg-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 2rem 1.75rem;
    }

    .login-logo {
      display: block;
      height: 44px;
      width: auto;
      margin: 0 auto 1.5rem;
    }

    .login-logo.has-station-logo {
      margin-bottom: 0.75rem;
    }

    .station-logo {
      display: block;
      max-width: 260px;
      width: 100%;
      height: auto;
      margin: 0 auto 1.5rem;
    }

    .login-field {
      margin-bottom: 1rem;
    }

    .login-field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .login-field input {
      width: 100%;
      background: var(--bg-darker);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.55rem 0.7rem;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .login-field input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .login-error {
      background: rgba(249, 115, 115, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      font-size: 0.82rem;
      margin-bottom: 1rem;
    }

    .login-submit {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 0.6rem 0.7rem;
      color: var(--bg-darker);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.12s;
    }

    .login-submit:hover {
      background: var(--accent-soft);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <img class="login-logo{% if ui_theme.station_logo %} has-station-logo{% endif %}" src="{% if ui_theme.logo %}{{ ui_theme.logo.url }}{% else %}{% static 'library/img/isadoraair_logo.png' %}{% endif %}" alt="IsadoraAir">
    {% if ui_theme.station_logo %}
    <img class="station-logo" src="{{ ui_theme.station_logo.url }}" alt="Station logo">
    {% endif %}

    {% if form.errors %}
    <div class="login-error">Incorrect username or password.</div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="login-field">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" autofocus autocapitalize="none" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-submit">Sign in</button>
    </form>
  </div>
</body>
</html>
