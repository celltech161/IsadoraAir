<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IsadoraAir{% endblock %}</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-darker: #0b1120;
      --panel-bg: rgba(15, 23, 42, 0.95);
      --accent: #22c55e;
      --accent-soft: #4ade80;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --danger: #f97373;
      --border-subtle: rgba(148, 163, 184, 0.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-darker);
      color: var(--text-main);
    }

    nav.topbar {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0 1.5rem;
      height: 52px;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border-subtle);
    }

    nav.topbar .brand {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    nav.topbar .nav-links {
      display: flex;
      gap: 0.25rem;
    }

    nav.topbar .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }

    nav.topbar .nav-links a:hover {
      color: var(--text-main);
      background: rgba(148, 163, 184, 0.1);
    }

    nav.topbar .nav-links a.active {
      color: var(--accent);
      background: rgba(34, 197, 94, 0.1);
    }

    nav.topbar .nav-clock {
      margin-left: auto;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    main {
      padding: 1.25rem 1.5rem;
      max-width: 100%;
      overflow-x: auto;
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <nav class="topbar">
    <a href="/" class="brand">IsadoraAir</a>
    <div class="nav-links">
      <a href="{% url 'library:schedule' %}" {% block nav_schedule %}{% endblock %}>Schedule</a>
      <a href="{% url 'library:logs' %}" {% block nav_logs %}{% endblock %}>Logs</a>
      <a href="{% url 'library:dashboard' %}" {% block nav_dashboard %}{% endblock %}>Dashboard</a>
      <a href="{% url 'library:library' %}" {% block nav_library %}{% endblock %}>Library</a>
      <a href="{% url 'library:playlists' %}" {% block nav_playlists %}{% endblock %}>Playlists</a>
    </div>
    <span class="nav-clock" id="navClock"></span>
  </nav>
  <script>
    function updateNavClock() {
      const el = document.getElementById('navClock');
      if (el) el.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
    }
    updateNavClock();
    setInterval(updateNavClock, 1000);
  </script>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block extra_js %}{% endblock %}
</body>
</html>
