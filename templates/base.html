{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IsadoraAir{% endblock %}</title>
  <style>
    :root {
      --bg-dark: {{ ui_theme.bg_dark }};
      --bg-darker: {{ ui_theme.bg_darker }};
      --panel-bg: {{ ui_theme.panel_bg }};
      --accent: {{ ui_theme.accent }};
      --accent-soft: {{ ui_theme.accent_soft }};
      --text-main: {{ ui_theme.text_main }};
      --text-muted: {{ ui_theme.text_muted }};
      --danger: {{ ui_theme.danger }};
      --border-subtle: {{ ui_theme.border_subtle }};
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-darker);
      color: var(--text-main);
    }

    nav.topbar {
      position: relative;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0 1.5rem;
      height: 52px;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border-subtle);
    }

    nav.topbar .brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    nav.topbar .brand img {
      height: 34px;
      width: auto;
      display: block;
    }

    nav.topbar .nav-links {
      display: flex;
      gap: 0.25rem;
    }

    nav.topbar .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }

    nav.topbar .nav-links a:hover {
      color: var(--text-main);
      background: rgba(148, 163, 184, 0.1);
    }

    nav.topbar .nav-links a.active {
      color: var(--accent);
      background: rgba(34, 197, 94, 0.1);
    }

    nav.topbar .nav-logout-form {
      display: contents;
    }

    nav.topbar .nav-logout-btn {
      color: var(--text-muted);
      background: none;
      border: none;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }

    nav.topbar .nav-logout-btn:hover {
      color: var(--danger);
      background: rgba(148, 163, 184, 0.1);
    }

    nav.topbar .nav-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    nav.topbar .nav-clock {
      font-size: {{ ui_theme.nav_clock_font_size }};
      font-weight: {{ ui_theme.nav_clock_font_weight }};
      color: {{ ui_theme.nav_clock_color }};
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    nav.topbar .nav-toggle {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      width: 32px;
      height: 32px;
      padding: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    nav.topbar .nav-toggle span {
      display: block;
      height: 2px;
      width: 100%;
      background: var(--text-main);
      border-radius: 1px;
    }

    @media (max-width: 700px) {
      nav.topbar .nav-links {
        display: none;
        position: absolute;
        top: 52px;
        left: 0;
        right: 0;
        flex-direction: column;
        gap: 0;
        background: var(--bg-dark);
        border-bottom: 1px solid var(--border-subtle);
        z-index: 100;
      }

      nav.topbar .nav-links.open {
        display: flex;
      }

      nav.topbar .nav-links a,
      nav.topbar .nav-logout-btn {
        display: block;
        width: 100%;
        text-align: left;
        padding: 0.75rem 1.5rem;
        border-radius: 0;
      }

      nav.topbar .nav-toggle {
        display: flex;
      }
    }

    main {
      padding: 1.25rem 1.5rem;
      max-width: 100%;
      overflow-x: auto;
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <nav class="topbar">
    <a href="/" class="brand"><img src="{% if ui_theme.logo %}{{ ui_theme.logo.url }}{% else %}{% static 'library/img/isadoraair_logo.png' %}{% endif %}" alt="IsadoraAir"></a>
    <div class="nav-links" id="navLinks">
      <a href="{% url 'library:schedule' %}" {% block nav_schedule %}{% endblock %}>Schedule</a>
      <a href="{% url 'library:logs' %}" {% block nav_logs %}{% endblock %}>Logs</a>
      <a href="{% url 'library:library' %}" {% block nav_library %}{% endblock %}>Library</a>
      <a href="{% url 'library:playlists' %}" {% block nav_playlists %}{% endblock %}>Playlists</a>
      <a href="{% url 'library:rotations' %}" {% block nav_rotations %}{% endblock %}>Rotations</a>
      {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}" class="nav-logout-form">
        {% csrf_token %}
        <button type="submit" class="nav-logout-btn">Log out</button>
      </form>
      {% endif %}
    </div>
    <div class="nav-right">
      <span class="nav-clock" id="navClock"></span>
      <button type="button" class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
  <script>
    function updateNavClock() {
      const el = document.getElementById('navClock');
      if (el) el.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
    }
    updateNavClock();
    setInterval(updateNavClock, 1000);

    const navToggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');
    if (navToggle && navLinks) {
      navToggle.addEventListener('click', () => {
        const isOpen = navLinks.classList.toggle('open');
        navToggle.setAttribute('aria-expanded', isOpen);
      });
    }
  </script>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block extra_js %}{% endblock %}
</body>
</html>
