{% extends "base.html" %}
{% block title %}Remote DJ — IsadoraAir{% endblock %}
{% block content %}
<div style="max-width: 480px; margin: 4rem auto; padding: 1.5rem;
            border: 1px solid var(--border-subtle); border-radius: 12px;
            background: var(--panel-bg);">
  <h2 style="margin-bottom: 0.75rem;">Remote DJ</h2>
  <p style="color: var(--text-muted); font-size: 0.9rem;">
    Your account isn't authorized for remote DJ access. Ask the studio
    to add your account to the <code>remote_dj</code> group.
  </p>
</div>
{% endblock %}
