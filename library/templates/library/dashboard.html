{% extends "base.html" %}

{% block title %}Dashboard — IsadoraAir{% endblock %}
{% block nav_dashboard %}class="active"{% endblock %}

{% block extra_css %}
<style>
  .playnow-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }

  .playnow-select {
    background: var(--bg-dark);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 0.45rem 0.65rem;
    color: var(--text-main);
    font-size: 0.85rem;
    cursor: pointer;
    min-width: 220px;
  }
  .playnow-select:focus { outline: none; border-color: var(--accent); }

  .playnow-btn {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #000;
    padding: 0.45rem 1rem;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.12s;
  }
  .playnow-btn:hover { opacity: 0.9; }

  .playnow-msg {
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .playnow-msg.error { color: var(--danger); }

  /* --- Decks row --- */
  .decks-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    align-items: stretch;
    margin-bottom: 1.25rem;
  }

  @media (max-width: 700px) {
    .decks-row { grid-template-columns: 1fr; }
  }

  .deck-panel {
    background: var(--bg-dark);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 1.1rem 1.3rem;
    min-width: 0;
  }

  .deck-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }

  .deck-label {
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
  }

  .deck-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .deck-btn {
    background: var(--bg-darker);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    color: var(--text-main);
    width: 30px;
    height: 26px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: border-color 0.12s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .deck-btn:hover { border-color: var(--accent); }
  .deck-btn.eject:hover { border-color: var(--danger); color: var(--danger); }
  .deck-btn:disabled { opacity: 0.3; cursor: default; }

  .transport-badge {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
  }
  .transport-badge.PLAYING { background: rgba(34, 197, 94, 0.15); color: var(--accent); }
  .transport-badge.PAUSED  { background: rgba(217, 119, 6, 0.2); color: #d97706; }
  .transport-badge.STOPPED { background: rgba(249, 115, 115, 0.15); color: var(--danger); }
  .transport-badge.OFFLINE { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }
  .transport-badge.STALE   { background: rgba(217, 119, 6, 0.2); color: #d97706; }
  .transport-badge.UPNEXT  { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }

  .np-meta {
    margin-bottom: 0.6rem;
    min-height: 3.6rem;
  }

  .np-title {
    font-size: 1.3rem;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 0.15rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .np-artist {
    font-size: 0.95rem;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .np-album {
    font-size: 0.78rem;
    color: var(--text-muted);
    opacity: 0.7;
    margin-top: 0.1rem;
  }

  .np-category {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: rgba(148, 163, 184, 0.12);
    color: var(--text-muted);
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    margin-top: 0.3rem;
  }

  /* --- Waveform --- */
  .np-waveform {
    position: relative;
    margin: 0.65rem 0;
  }

  .np-waveform canvas {
    width: 100%;
    height: 56px;
    display: block;
    border-radius: 6px;
  }

  .np-waveform .position-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #fff;
    pointer-events: none;
  }

  /* --- Countdown + progress --- */
  .np-timing {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    margin-top: 0.4rem;
  }

  .np-countdown {
    font-size: 1.6rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    min-width: 76px;
  }

  .np-countdown.warning { color: #d97706; }
  .np-countdown.critical { color: var(--danger); }

  .np-progress-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .np-progress-bar {
    height: 6px;
    background: rgba(148, 163, 184, 0.15);
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
  }
  .np-progress-bar:hover { height: 10px; }

  .np-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
  }

  .np-times {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .deck-empty {
    text-align: center;
    padding: 2.25rem 1rem;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .deck-empty .offline-icon {
    font-size: 1.8rem;
    margin-bottom: 0.5rem;
    opacity: 0.4;
  }

  /* --- Coming Up (below decks, full width, horizontal) --- */
  .queue-panel {
    background: var(--bg-dark);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 1rem;
  }

  .queue-panel h3 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 0.6rem;
  }

  .queue-table-wrap {
    overflow-x: auto;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
  }

  table.queue-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  table.queue-table th {
    background: var(--bg-darker);
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 0.45rem 0.6rem;
    text-align: left;
    border-bottom: 1px solid var(--border-subtle);
  }

  table.queue-table td {
    padding: 0.4rem 0.6rem;
    border-bottom: 1px solid rgba(148, 163, 184, 0.08);
    color: var(--text-main);
  }

  table.queue-table tr:hover td {
    background: rgba(148, 163, 184, 0.05);
  }

  td.qt-pos, td.qt-dur { color: var(--text-muted); text-align: center; white-space: nowrap; }
  td.qt-cat { color: var(--text-muted); font-size: 0.75rem; }

  .qt-next-btn {
    background: none;
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    color: var(--text-muted);
    font-size: 0.7rem;
    padding: 0.15rem 0.4rem;
    cursor: pointer;
    transition: color 0.12s, border-color 0.12s;
  }
  .qt-next-btn:hover { color: var(--accent); border-color: var(--accent); }

  table.queue-table tr[draggable="true"] { cursor: grab; }
  table.queue-table tr[draggable="true"]:active { cursor: grabbing; }
  table.queue-table tr.drag-over td { border-top: 2px solid var(--accent); }
  table.queue-table tr.dragging td { opacity: 0.3; }

  .queue-empty {
    color: var(--text-muted);
    font-size: 0.8rem;
    padding: 1rem 0;
    text-align: center;
  }

  /* --- Queue search insert --- */
  .queue-insert {
    margin-top: 0.6rem;
    position: relative;
  }

  .queue-insert-input {
    width: 100%;
    max-width: 320px;
    background: var(--bg-darker);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    color: var(--text-main);
    font-size: 0.78rem;
  }
  .queue-insert-input:focus { outline: none; border-color: var(--accent); }
  .queue-insert-input::placeholder { color: var(--text-muted); }

  .queue-insert-results {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    max-width: 320px;
    background: var(--bg-dark);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    max-height: 250px;
    overflow-y: auto;
    display: none;
    margin-top: 4px;
    z-index: 10;
  }
  .queue-insert-results.visible { display: block; }

  .qir-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 0.6rem;
    cursor: pointer;
    font-size: 0.78rem;
    transition: background 0.1s;
  }
  .qir-item:hover { background: rgba(148, 163, 184, 0.1); }
  .qir-item .qir-artist { color: var(--text-muted); font-size: 0.72rem; }
  .qir-item .qir-dur { color: var(--text-muted); font-size: 0.7rem; margin-left: auto; }
</style>
{% endblock %}

{% block content %}
<div class="playnow-bar">
  <select class="playnow-select" id="playNowSelect">
    <option value="">Play a playlist now...</option>
    {% for pl in playlists %}
    <option value="{{ pl.id }}">{{ pl.name }}</option>
    {% endfor %}
  </select>
  <button class="playnow-btn" onclick="playNow()">Play Now</button>
  <span class="playnow-msg" id="playNowMsg"></span>
</div>

<div class="decks-row">
  <div class="deck-panel" id="deck-A"></div>
  <div class="deck-panel" id="deck-B"></div>
</div>

<div class="queue-panel" id="queuePanel">
  <h3>Coming Up</h3>
  <div class="queue-table-wrap">
    <table class="queue-table">
      <thead>
        <tr>
          <th></th>
          <th>#</th>
          <th>Artist</th>
          <th>Title</th>
          <th>Cat</th>
          <th>Dur</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="queueList">
        <tr><td colspan="7" class="queue-empty">No queue data</td></tr>
      </tbody>
    </table>
  </div>
  <div class="queue-insert">
    <input type="text" class="queue-insert-input" id="queueInsertSearch"
           placeholder="Search to add track...">
    <div class="queue-insert-results" id="queueInsertResults"></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const SLOTS = ['A', 'B'];

// Per-slot mutable state, keyed by slot letter.
const deckState = {};
SLOTS.forEach(s => {
  deckState[s] = {
    lastTrackId: null,
    localPosition: 0,
    localDuration: 0,
    localNextStart: 0,
    lastPollTime: 0,
    deckBuilt: false,
    paused: false,
    mode: null, // 'offline' | 'empty' | 'preview' | 'live'
  };
});

const waveformState = {};
SLOTS.forEach(s => {
  waveformState[s] = { samples: null, cueIn: null, nextStart: null, analysisDuration: null };
});

function fmtDur(sec) {
  if (!sec && sec !== 0) return '0:00';
  const m = Math.floor(Math.abs(sec) / 60);
  const s = Math.round(Math.abs(sec) % 60);
  return (sec < 0 ? '-' : '') + m + ':' + String(s).padStart(2, '0');
}

function getCookie(name) {
  let val = null;
  document.cookie.split(';').forEach(c => {
    c = c.trim();
    if (c.startsWith(name + '='))
      val = decodeURIComponent(c.substring(name.length + 1));
  });
  return val;
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function playNow() {
  const sel = document.getElementById('playNowSelect');
  const msg = document.getElementById('playNowMsg');
  const id = sel.value;
  if (!id) return;

  msg.textContent = 'Starting...';
  msg.className = 'playnow-msg';

  const resp = await fetch(`/api/playlists/${id}/play-now/`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
  });
  const data = await resp.json();

  if (!resp.ok) {
    msg.textContent = data.error || 'Could not start playlist';
    msg.className = 'playnow-msg error';
    return;
  }

  msg.textContent = `Playing now (${data.item_count} tracks)`;
  sel.value = '';
}

async function fetchStatus() {
  try {
    const resp = await fetch('/api/engine/status/');
    if (!resp.ok) return null;
    return await resp.json();
  } catch {
    return null;
  }
}

async function loadWaveform(slot, trackId) {
  try {
    const resp = await fetch(`/api/waveform/${trackId}/`);
    if (!resp.ok) { waveformState[slot].samples = null; return; }
    const data = await resp.json();
    waveformState[slot] = {
      samples: data.samples,
      cueIn: data.cue_in_seconds,
      nextStart: data.next_start,
      analysisDuration: data.analysis_duration,
    };
    drawWaveform(slot);
  } catch {
    waveformState[slot].samples = null;
  }
}

function drawWaveform(slot) {
  const canvas = document.getElementById(`npWaveform-${slot}`);
  const wf = waveformState[slot];
  if (!canvas || !wf.samples) return;

  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const w = rect.width;
  const h = rect.height;
  const n = wf.samples.length;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(34, 197, 94, 0.35)';

  for (let i = 0; i < n; i++) {
    const level = wf.samples[i] / 255;
    const barH = level * h;
    const x = (i / n) * w;
    const barW = Math.ceil(w / n);
    ctx.fillRect(x, h - barH, barW, barH);
  }

  const dur = wf.analysisDuration || deckState[slot].localDuration || 1;

  if (wf.cueIn && wf.cueIn > 0) {
    const x = (wf.cueIn / dur) * w;
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if (wf.nextStart) {
    const x = (wf.nextStart / dur) * w;
    ctx.strokeStyle = '#f97373';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function updatePositionIndicators() {
  SLOTS.forEach(slot => {
    const st = deckState[slot];
    if (st.mode !== 'live') return;
    const line = document.getElementById(`posLine-${slot}`);
    if (!line || !st.localDuration) return;

    let pos = st.localPosition;
    if (!st.paused) {
      const elapsed = (Date.now() - st.lastPollTime) / 1000;
      pos = st.localPosition + elapsed;
    }
    const pct = Math.min(100, (pos / st.localDuration) * 100);
    line.style.left = pct + '%';

    const countdownEl = document.getElementById(`npCountdown-${slot}`);
    if (countdownEl && st.localNextStart) {
      const remaining = Math.max(0, st.localNextStart - pos);
      countdownEl.textContent = fmtDur(remaining);
      countdownEl.className = 'np-countdown' +
        (remaining < 10 ? ' critical' : remaining < 30 ? ' warning' : '');
    }

    const fill = document.getElementById(`npProgressFill-${slot}`);
    if (fill) fill.style.width = pct + '%';

    const elapsedEl = document.getElementById(`npElapsed-${slot}`);
    if (elapsedEl) elapsedEl.textContent = fmtDur(pos);
  });
}

function buildDeckDOM(slot) {
  const container = document.getElementById(`deck-${slot}`);

  container.innerHTML = `
    <div class="deck-header-row">
      <span class="deck-label">Deck ${slot}</span>
      <div class="deck-controls">
        <span class="transport-badge" id="transportBadge-${slot}"></span>
        <button class="deck-btn" id="playPauseBtn-${slot}" title="Play/Pause">&#9654;</button>
        <button class="deck-btn eject" id="ejectBtn-${slot}" title="Eject">&#9169;</button>
      </div>
    </div>
    <div class="np-meta">
      <div class="np-title" id="npTitle-${slot}"></div>
      <div class="np-artist" id="npArtist-${slot}"></div>
      <div class="np-album" id="npAlbum-${slot}"></div>
      <span class="np-category" id="npCategory-${slot}"></span>
    </div>
    <div class="np-waveform">
      <canvas id="npWaveform-${slot}"></canvas>
      <div class="position-line" id="posLine-${slot}"></div>
    </div>
    <div class="np-timing">
      <div class="np-countdown" id="npCountdown-${slot}"></div>
      <div class="np-progress-wrap">
        <div class="np-progress-bar">
          <div class="np-progress-fill" id="npProgressFill-${slot}"></div>
        </div>
        <div class="np-times">
          <span id="npElapsed-${slot}"></span>
          <span id="npTotal-${slot}"></span>
        </div>
      </div>
    </div>
  `;

  deckState[slot].deckBuilt = true;

  document.getElementById(`npProgressFill-${slot}`).parentElement.addEventListener('click', function(e) {
    if (!deckState[slot].localDuration) return;
    const rect = this.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    const pos = pct * deckState[slot].localDuration;
    seekTo(slot, Math.max(0, Math.min(deckState[slot].localDuration, pos)));
  });

  document.getElementById(`playPauseBtn-${slot}`).addEventListener('click', () => {
    deckCommand(slot, deckState[slot].paused ? 'resume' : 'pause');
  });
  document.getElementById(`ejectBtn-${slot}`).addEventListener('click', () => {
    deckCommand(slot, 'eject');
  });
}

function renderDeck(slot, deck, transport, queue) {
  if (transport === 'OFFLINE' || transport === 'STOPPED') {
    renderDeckOffline(slot, transport);
    return;
  }
  if (deck) {
    renderDeckLive(slot, deck, transport);
    return;
  }
  const previewTrack = (queue && queue.length) ? queue[0] : null;
  if (previewTrack) {
    renderDeckPreview(slot, previewTrack);
  } else {
    renderDeckEmpty(slot);
  }
}

function renderDeckOffline(slot, transport) {
  const st = deckState[slot];
  st.mode = 'offline';
  st.lastTrackId = null;
  st.deckBuilt = false;
  document.getElementById(`deck-${slot}`).innerHTML = `
    <div class="deck-header-row"><span class="deck-label">Deck ${slot}</span></div>
    <div class="deck-empty">
      <div class="offline-icon">${transport === 'STOPPED' ? '&#9632;' : '&#9654;'}</div>
      ${transport === 'STOPPED' ? 'Engine stopped' : 'Engine not running'}
    </div>
  `;
}

function renderDeckEmpty(slot) {
  const st = deckState[slot];
  st.mode = 'empty';
  st.lastTrackId = null;
  st.deckBuilt = false;
  document.getElementById(`deck-${slot}`).innerHTML = `
    <div class="deck-header-row"><span class="deck-label">Deck ${slot}</span></div>
    <div class="deck-empty">
      <div class="offline-icon">&#9654;</div>
      Nothing queued
    </div>
  `;
}

function renderDeckPreview(slot, track) {
  const st = deckState[slot];

  if (st.mode !== 'preview') {
    buildDeckDOM(slot);
    st.mode = 'preview';
    st.lastTrackId = null;
    document.getElementById(`playPauseBtn-${slot}`).style.display = 'none';
    document.getElementById(`ejectBtn-${slot}`).style.display = 'none';
    document.querySelector(`#deck-${slot} .np-timing`).style.display = 'none';
  }

  const badge = document.getElementById(`transportBadge-${slot}`);
  badge.textContent = 'UP NEXT';
  badge.className = 'transport-badge UPNEXT';

  if (track.track_id !== st.lastTrackId) {
    st.lastTrackId = track.track_id;
    loadWaveform(slot, track.track_id);

    document.getElementById(`npTitle-${slot}`).textContent = track.title || '';
    document.getElementById(`npArtist-${slot}`).textContent = track.artist || '';
    document.getElementById(`npAlbum-${slot}`).style.display = 'none';
    const catEl = document.getElementById(`npCategory-${slot}`);
    catEl.textContent = track.category || '';
    catEl.style.display = track.category ? '' : 'none';
    document.getElementById(`npTotal-${slot}`).textContent = fmtDur(track.duration);
  }
}

function renderDeckLive(slot, deck, transport) {
  const st = deckState[slot];

  if (st.mode !== 'live') {
    buildDeckDOM(slot);
    st.mode = 'live';
    st.lastTrackId = null;
    document.getElementById(`playPauseBtn-${slot}`).style.display = '';
    document.getElementById(`ejectBtn-${slot}`).style.display = '';
    document.querySelector(`#deck-${slot} .np-timing`).style.display = '';
  }

  if (deck.track_id !== st.lastTrackId) {
    st.lastTrackId = deck.track_id;
    loadWaveform(slot, deck.track_id);

    document.getElementById(`npTitle-${slot}`).textContent = deck.title || '';
    document.getElementById(`npArtist-${slot}`).textContent = deck.artist || '';
    const albumEl = document.getElementById(`npAlbum-${slot}`);
    albumEl.textContent = deck.album || '';
    albumEl.style.display = deck.album ? '' : 'none';
    const catEl = document.getElementById(`npCategory-${slot}`);
    catEl.textContent = deck.category || '';
    catEl.style.display = deck.category ? '' : 'none';
    document.getElementById(`npTotal-${slot}`).textContent = fmtDur(deck.duration);
  }

  st.paused = !!deck.paused;

  const badge = document.getElementById(`transportBadge-${slot}`);
  const badgeState = st.paused ? 'PAUSED' : transport;
  badge.textContent = badgeState;
  badge.className = 'transport-badge ' + badgeState;

  const playPauseBtn = document.getElementById(`playPauseBtn-${slot}`);
  if (playPauseBtn) playPauseBtn.innerHTML = st.paused ? '&#9654;' : '&#10074;&#10074;';

  st.localPosition = deck.position || 0;
  st.localDuration = deck.duration || 0;
  st.localNextStart = deck.next_start || st.localDuration;
  st.lastPollTime = Date.now();
}

async function deckCommand(slot, action) {
  await fetch(`/api/engine/deck/${slot}/`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
    body: JSON.stringify({ action }),
  });
  poll();
}

async function seekTo(slot, seconds) {
  await fetch('/api/engine/seek/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
    body: JSON.stringify({ position: seconds }),
  });
  deckState[slot].localPosition = seconds;
  deckState[slot].lastPollTime = Date.now();
}

let currentLogId = null;
let queueItemIds = [];
let insertDebounce = null;

function renderQueue(data) {
  const list = document.getElementById('queueList');
  const queue = data.queue || [];
  currentLogId = data.log_id;

  if (!queue.length) {
    list.innerHTML = '<tr><td colspan="7" class="queue-empty">No upcoming tracks</td></tr>';
    queueItemIds = [];
    return;
  }

  queueItemIds = queue.map(q => q.item_id);

  list.innerHTML = queue.map((q, i) => `
    <tr draggable="true" data-item-id="${q.item_id}">
      <td class="qt-pos" style="cursor:grab;">&#9776;</td>
      <td class="qt-pos">${i + 1}</td>
      <td>${esc(q.artist)}</td>
      <td>${esc(q.title)}</td>
      <td class="qt-cat">${esc(q.category)}</td>
      <td class="qt-dur">${fmtDur(q.duration)}</td>
      <td><button class="qt-next-btn" onclick="event.stopPropagation(); setNext(${q.item_id})">next</button></td>
    </tr>
  `).join('');

  initQueueDrag();
}

function initQueueDrag() {
  const list = document.getElementById('queueList');
  let dragEl = null;

  list.querySelectorAll('tr[draggable]').forEach(row => {
    row.addEventListener('dragstart', () => {
      dragEl = row;
      row.classList.add('dragging');
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      list.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over'));
      dragEl = null;
    });
    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      list.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over'));
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', async (e) => {
      e.preventDefault();
      row.classList.remove('drag-over');
      if (!dragEl || dragEl === row) return;
      list.insertBefore(dragEl, row);
      const order = [...list.querySelectorAll('tr')].map(
        r => parseInt(r.dataset.itemId)
      );
      if (!currentLogId) return;
      // Resync from the server either way -- if this 400s (or the log
      // changed underneath us), the poll puts the table back to
      // whatever's actually true instead of leaving a reorder that
      // looks applied but silently didn't stick.
      await fetch(`/api/log/${currentLogId}/reorder/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
        body: JSON.stringify({ order }),
      });
      poll();
    });
  });
}

async function setNext(itemId) {
  await fetch('/api/engine/queue/set-next/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
    body: JSON.stringify({ item_id: itemId }),
  });
  poll();
}

// --- Search to insert ---
document.getElementById('queueInsertSearch').addEventListener('input', function() {
  clearTimeout(insertDebounce);
  const q = this.value.trim();
  if (q.length < 2) {
    document.getElementById('queueInsertResults').classList.remove('visible');
    return;
  }
  insertDebounce = setTimeout(() => searchForInsert(q), 300);
});

document.getElementById('queueInsertSearch').addEventListener('blur', function() {
  setTimeout(() => document.getElementById('queueInsertResults').classList.remove('visible'), 200);
});

async function searchForInsert(q) {
  const resp = await fetch(`/api/tracks/?q=${encodeURIComponent(q)}&per_page=10&ready2air=true`);
  if (!resp.ok) return;
  const data = await resp.json();
  const container = document.getElementById('queueInsertResults');

  if (!data.items.length) {
    container.classList.remove('visible');
    return;
  }

  container.innerHTML = data.items.map(t => `
    <div class="qir-item" onmousedown="insertTrack(${t.id})">
      <span>${esc(t.title)}</span>
      <span class="qir-artist">${esc(t.artist)}</span>
      <span class="qir-dur">${fmtDur(t.duration_seconds)}</span>
    </div>
  `).join('');
  container.classList.add('visible');
}

async function insertTrack(trackId) {
  await fetch('/api/engine/queue/insert/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
    body: JSON.stringify({ track_id: trackId }),
  });
  document.getElementById('queueInsertSearch').value = '';
  document.getElementById('queueInsertResults').classList.remove('visible');
  poll();
}

// --- Main poll loop ---
async function poll() {
  const data = await fetchStatus();
  if (!data) return;
  const decks = data.decks || {};
  const queue = data.queue || [];
  SLOTS.forEach(slot => renderDeck(slot, decks[slot], data.transport, queue));
  renderQueue(data);
}

// Poll engine status every 1 second
setInterval(poll, 1000);

// Update position/countdown smoothly between polls
setInterval(updatePositionIndicators, 100);

// Initial load
poll();
</script>
