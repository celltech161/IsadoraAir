{% extends "base.html" %}

{% block title %}Dashboard — IsadoraAir{% endblock %}
{% block nav_dashboard %}class="active"{% endblock %}

{% block extra_css %}
<style>
  .dash-grid {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 1.25rem;
    align-items: flex-start;
  }

  @media (max-width: 900px) {
    .dash-grid { grid-template-columns: 1fr; }
  }

  /* --- Now Playing --- */
  .now-playing {
    background: var(--bg-dark);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
  }

  .np-status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }

  .transport-badge {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
  }
  .transport-badge.PLAYING { background: rgba(34, 197, 94, 0.15); color: var(--accent); }
  .transport-badge.STOPPED { background: rgba(249, 115, 115, 0.15); color: var(--danger); }
  .transport-badge.OFFLINE { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }
  .transport-badge.STALE   { background: rgba(217, 119, 6, 0.2); color: #d97706; }

  .np-clock {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .np-meta {
    margin-bottom: 0.75rem;
  }

  .np-title {
    font-size: 1.6rem;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 0.2rem;
  }

  .np-artist {
    font-size: 1.05rem;
    color: var(--text-muted);
  }

  .np-album {
    font-size: 0.82rem;
    color: var(--text-muted);
    opacity: 0.7;
    margin-top: 0.1rem;
  }

  .np-category {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: rgba(148, 163, 184, 0.12);
    color: var(--text-muted);
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    margin-top: 0.3rem;
  }

  /* --- Waveform --- */
  .np-waveform {
    position: relative;
    margin: 0.75rem 0;
  }

  .np-waveform canvas {
    width: 100%;
    height: 64px;
    display: block;
    border-radius: 6px;
  }

  .np-waveform .position-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #fff;
    pointer-events: none;
  }

  /* --- Countdown + progress --- */
  .np-timing {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-top: 0.5rem;
  }

  .np-countdown {
    font-size: 2rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    min-width: 90px;
  }

  .np-countdown.warning { color: #d97706; }
  .np-countdown.critical { color: var(--danger); }

  .np-progress-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .np-progress-bar {
    height: 6px;
    background: rgba(148, 163, 184, 0.15);
    border-radius: 3px;
    overflow: hidden;
  }

  .np-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
  }

  .np-times {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  /* --- Next Up --- */
  .next-up {
    background: var(--bg-dark);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    margin-top: 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .next-up-label {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .next-up-info {
    flex: 1;
    min-width: 0;
  }

  .next-up-title {
    font-size: 0.9rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .next-up-artist {
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .next-up-dur {
    font-size: 0.78rem;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  /* --- Sidebar queue --- */
  .queue-panel {
    background: var(--bg-dark);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 1rem;
  }

  .queue-panel h3 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 0.6rem;
  }

  .queue-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.5rem;
    border-radius: 5px;
    margin-bottom: 2px;
    font-size: 0.8rem;
    transition: background 0.1s;
  }

  .queue-item:hover { background: rgba(148, 163, 184, 0.06); }

  .queue-item .qi-pos {
    width: 20px;
    font-size: 0.7rem;
    color: var(--text-muted);
    text-align: center;
    flex-shrink: 0;
  }

  .queue-item .qi-info {
    flex: 1;
    min-width: 0;
  }

  .queue-item .qi-title {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .queue-item .qi-artist {
    font-size: 0.72rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .queue-item .qi-dur {
    font-size: 0.72rem;
    color: var(--text-muted);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .queue-item .qi-cat {
    font-size: 0.65rem;
    color: var(--text-muted);
    opacity: 0.7;
    flex-shrink: 0;
  }

  .queue-empty {
    color: var(--text-muted);
    font-size: 0.8rem;
    padding: 1rem 0;
    text-align: center;
  }

  .offline-msg {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  .offline-msg .offline-icon {
    font-size: 2rem;
    margin-bottom: 0.5rem;
    opacity: 0.4;
  }
</style>
{% endblock %}

{% block content %}
<div class="dash-grid">
  <div>
    <div class="now-playing" id="nowPlaying">
      <div class="offline-msg" id="offlineMsg">
        <div class="offline-icon">&#9654;</div>
        Engine not running
      </div>
    </div>
    <div class="next-up" id="nextUp" style="display:none;"></div>
  </div>

  <div class="queue-panel" id="queuePanel">
    <h3>Coming Up</h3>
    <div id="queueList">
      <div class="queue-empty">No queue data</div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let lastTrackId = null;
let waveformSamples = null;
let localPosition = 0;
let localDuration = 0;
let localNextStart = 0;
let lastPollTime = 0;

function fmtDur(sec) {
  if (!sec && sec !== 0) return '0:00';
  const m = Math.floor(Math.abs(sec) / 60);
  const s = Math.round(Math.abs(sec) % 60);
  return (sec < 0 ? '-' : '') + m + ':' + String(s).padStart(2, '0');
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function fetchStatus() {
  try {
    const resp = await fetch('/api/engine/status/');
    if (!resp.ok) return null;
    return await resp.json();
  } catch {
    return null;
  }
}

async function loadWaveform(trackId) {
  try {
    const resp = await fetch(`/api/waveform/${trackId}/`);
    if (!resp.ok) { waveformSamples = null; return; }
    const data = await resp.json();
    waveformSamples = data.samples;
    drawWaveform();
  } catch {
    waveformSamples = null;
  }
}

function drawWaveform() {
  const canvas = document.getElementById('npWaveform');
  if (!canvas || !waveformSamples) return;

  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const w = rect.width;
  const h = rect.height;
  const n = waveformSamples.length;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(34, 197, 94, 0.35)';

  for (let i = 0; i < n; i++) {
    const level = waveformSamples[i] / 255;
    const barH = level * h;
    const x = (i / n) * w;
    const barW = Math.ceil(w / n);
    ctx.fillRect(x, h - barH, barW, barH);
  }
}

function updatePositionIndicator() {
  const line = document.getElementById('posLine');
  if (!line || !localDuration) return;

  const elapsed = (Date.now() - lastPollTime) / 1000;
  const pos = localPosition + elapsed;
  const pct = Math.min(100, (pos / localDuration) * 100);
  line.style.left = pct + '%';

  // Update countdown
  const countdownEl = document.getElementById('npCountdown');
  if (countdownEl && localNextStart) {
    const remaining = Math.max(0, localNextStart - pos);
    countdownEl.textContent = fmtDur(remaining);
    countdownEl.className = 'np-countdown' +
      (remaining < 10 ? ' critical' : remaining < 30 ? ' warning' : '');
  }

  // Update progress bar
  const fill = document.getElementById('npProgressFill');
  if (fill) fill.style.width = pct + '%';

  // Update elapsed time
  const elapsedEl = document.getElementById('npElapsed');
  if (elapsedEl) elapsedEl.textContent = fmtDur(pos);
}

let deckBuilt = false;

function buildDeckDOM(data) {
  const np = data.now_playing;
  const container = document.getElementById('nowPlaying');

  container.innerHTML = `
    <div class="np-status-row">
      <span class="transport-badge" id="transportBadge"></span>
      <span class="np-clock" id="liveClock"></span>
    </div>
    <div class="np-meta">
      <div class="np-title" id="npTitle"></div>
      <div class="np-artist" id="npArtist"></div>
      <div class="np-album" id="npAlbum"></div>
      <span class="np-category" id="npCategory"></span>
    </div>
    <div class="np-waveform">
      <canvas id="npWaveform"></canvas>
      <div class="position-line" id="posLine"></div>
    </div>
    <div class="np-timing">
      <div class="np-countdown" id="npCountdown"></div>
      <div class="np-progress-wrap">
        <div class="np-progress-bar">
          <div class="np-progress-fill" id="npProgressFill"></div>
        </div>
        <div class="np-times">
          <span id="npElapsed"></span>
          <span id="npTotal"></span>
        </div>
      </div>
    </div>
  `;

  deckBuilt = true;
}

function renderNowPlaying(data) {
  const np = data.now_playing;
  const container = document.getElementById('nowPlaying');
  const nextUpEl = document.getElementById('nextUp');

  if (!np || data.transport === 'OFFLINE' || data.transport === 'STOPPED') {
    container.innerHTML = `
      <div class="offline-msg">
        <div class="offline-icon">${data.transport === 'STOPPED' ? '&#9632;' : '&#9654;'}</div>
        ${data.transport === 'STOPPED' ? 'Engine stopped' : 'Engine not running'}
      </div>
    `;
    nextUpEl.style.display = 'none';
    lastTrackId = null;
    deckBuilt = false;
    return;
  }

  // Build DOM structure once, then just update values
  if (!deckBuilt) buildDeckDOM(data);

  // Update track info only on track change
  if (np.track_id !== lastTrackId) {
    lastTrackId = np.track_id;
    loadWaveform(np.track_id);

    document.getElementById('npTitle').textContent = np.title || '';
    document.getElementById('npArtist').textContent = np.artist || '';
    const albumEl = document.getElementById('npAlbum');
    albumEl.textContent = np.album || '';
    albumEl.style.display = np.album ? '' : 'none';
    const catEl = document.getElementById('npCategory');
    catEl.textContent = np.category || '';
    catEl.style.display = np.category ? '' : 'none';
    document.getElementById('npTotal').textContent = fmtDur(np.duration);
  }

  // Update transport badge
  const badge = document.getElementById('transportBadge');
  badge.textContent = data.transport;
  badge.className = 'transport-badge ' + data.transport;

  // Update position timing
  localPosition = np.position || 0;
  localDuration = np.duration || 0;
  localNextStart = np.next_start || localDuration;
  lastPollTime = Date.now();

  // Next up
  if (data.next_up) {
    const nu = data.next_up;
    nextUpEl.style.display = '';
    nextUpEl.innerHTML = `
      <span class="next-up-label">Next</span>
      <div class="next-up-info">
        <div class="next-up-title">${esc(nu.title)}</div>
        <div class="next-up-artist">${esc(nu.artist)}</div>
      </div>
      <span class="next-up-dur">${fmtDur(nu.duration)}</span>
    `;
  } else {
    nextUpEl.style.display = 'none';
  }
}

function renderQueue(data) {
  const list = document.getElementById('queueList');
  const queue = data.queue || [];

  if (!queue.length) {
    list.innerHTML = '<div class="queue-empty">No upcoming tracks</div>';
    return;
  }

  list.innerHTML = queue.map((q, i) => `
    <div class="queue-item">
      <span class="qi-pos">${i + 1}</span>
      <div class="qi-info">
        <div class="qi-title">${esc(q.title)}</div>
        <div class="qi-artist">${esc(q.artist)}</div>
      </div>
      <span class="qi-cat">${esc(q.category)}</span>
      <span class="qi-dur">${fmtDur(q.duration)}</span>
    </div>
  `).join('');
}

function updateClock() {
  const el = document.getElementById('liveClock');
  if (el) {
    const now = new Date();
    el.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
  }
}

// --- Main poll loop ---
async function poll() {
  const data = await fetchStatus();
  if (data) {
    renderNowPlaying(data);
    renderQueue(data);
  }
}

// Poll engine status every 1 second
setInterval(poll, 1000);

// Update position/countdown smoothly between polls
setInterval(updatePositionIndicator, 100);

// Update clock every second
setInterval(updateClock, 1000);

// Initial load
poll();
updateClock();
</script>
{% endblock %}
