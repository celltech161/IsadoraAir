      send.slice(i + 1).forEach(rest => results.push({ finding_id: rest.finding_id, direction: rest.direction,
        outcome: 'not_attempted', message: 'Not sent: processing stopped at the repair above.' }));
      break;
    }
  }
  driftBusy = false;
  driftChoices = new Map();                   // a fresh view of the current state is required before another batch
  renderDriftResults({ scan_id: preview.scan_id, items: results, processed, total: send.length, stopped });
  updateDriftBar();
  loadFindings();
}

function renderDriftResults(data) {
  const counts = {};
  data.items.forEach(r => { counts[r.outcome] = (counts[r.outcome] || 0) + 1; });
  const nodes = [el('p', `Processed ${data.processed} of ${data.total} repair(s). Result: ` +
    Object.entries(counts).map(([k, n]) => `${DRIFT_OUTCOME[k] || k}: ${n}`).join(' · '), data.stopped ? 'rc-warn' : 'rc-ok')];
  if (data.stopped === 'unknown') {
    nodes.push(el('p', 'Stopped: the answer for one repair was lost or uncertain, so whether it was applied is not known, ' +
                       'and the repairs after it were not sent. Check that Track before trying again.', 'rc-warn'));
  } else if (data.stopped === 'attention') {
    nodes.push(el('p', 'Stopped: one repair needs your attention (see below) before anything else is done.', 'rc-warn'));
  }
  data.items.forEach(r => {
    const card = el('div', undefined, 'rc-card');
    const head = el('h3');
    head.append(el('span', DRIFT_OUTCOME[r.outcome] || r.outcome, 'rc-badge'));
    head.append(el('span', `#${r.track_id || '?'} ${r.message || ''}`));
    card.append(head);
    if (r.outcome === 'moved' || r.outcome === 'committed_cleanup_required') {
      card.append(el('p', `${r.source} → ${r.destination}`, 'rc-code'));
    }
    if (r.outcome === 'updated') card.append(el('p', `Primary Category ${r.category_from} → ${r.category_to}; the file was not moved.`));
    if (r.cleanup_message) card.append(el('p', r.cleanup_message, r.attention ? 'rc-bad' : 'rc-warn'));
    nodes.push(card);
  });
  nodes.push(el('p', `The findings below are still from scan ${data.scan_id} (a snapshot). Run reconciliation for a new ` +
                     'scan: a repaired finding is gone only when its Track and file actually agree.', 'rc-muted'));
  nodes.push(closeDriftButton());
  showDrift(nodes);
}

// ---- Selections belong to the findings page on screen. A page, filter or search change with selections made
// asks first: stay (the controls go back to the page shown) or discard them and continue. A search asks once the
// typing pauses (the existing debounce), not on every keystroke.
let shown = { t: '', q: '', open: true }, choicesScan;
function restoreFilters() {
  document.getElementById('typeFilter').value = shown.t;
  document.getElementById('search').value = shown.q;
  document.getElementById('openOnly').checked = shown.open;
  markChips();
  renderDriftTools(null);
}
function showGuard(nodes) {
  const guard = document.getElementById('navGuard');
  guard.replaceChildren(...nodes);
  guard.hidden = false;
  guard.scrollIntoView({ block: 'nearest' });
}
function applyFilters(f) {
  document.getElementById('typeFilter').value = f.t;
  document.getElementById('search').value = f.q;
  document.getElementById('openOnly').checked = f.open;
  markChips();
}
function navigate(change) {
  const guard = document.getElementById('navGuard');
  if (!choices.size && !driftChoices.size) { guard.hidden = true; change(); loadFindings(); return; }
  if (resolveBusy || driftBusy) {
    restoreFilters();
    showGuard([el('p', 'The selected pairs are being applied; change the page or filters when that has finished.', 'rc-warn')]);
    return;
  }
  // The findings shown stay as they are until the operator answers (loadFindings keeps their filters while
  // selections exist); what was asked for is replayed only after a discard.
  const want = { t: document.getElementById('typeFilter').value, q: document.getElementById('search').value,
                 open: document.getElementById('openOnly').checked };
  const row = el('div', undefined, 'rc-actions');
  row.append(actionButton('Stay and keep selections', () => { guard.hidden = true; restoreFilters(); }),
             actionButton('Discard selections and continue', () => {
               guard.hidden = true;
               choices = new Map();
               driftChoices = new Map();
               resolveGen += 1;
               driftGen += 1;
               document.getElementById('resolvePanel').hidden = true;
               document.getElementById('driftPanel').hidden = true;
               updateResolveBar();
               updateDriftBar();
               applyFilters(want);
               change();
               loadFindings();
             }));
  const pending = [choices.size ? `${choices.size} duplicate selection(s)` : '',
                   driftChoices.size ? `${driftChoices.size} category-drift selection(s)` : ''].filter(Boolean).join(' and ');
  showGuard([el('p', `${pending} on this page have not been applied. Changing the page, ` +
                     'filter or search discards them.', 'rc-warn'), row]);
}

function renderFinding(f) {
  const card = el('article', undefined, 'rc-card');
  const h = el('h3');
  h.append(el('span', TYPE_TEXT[f.type] || f.type, 'rc-badge t-' + f.type));
  if (f.confidence) h.append(el('span', f.confidence.replace('_', ' '), 'rc-badge'));
  h.append(el('span', f.reason));
  card.append(h);
  if (f.track) renderTrack(card, f.track);
  if (f.file) card.append(el('p', `File: ${f.file.rel} (${fmtSize(f.file.size)})`, 'rc-code'));
  if (f.track_ids && f.type === 'shared_source') card.append(el('p', 'Tracks: #' + f.track_ids.join(', #')));
  if (f.candidates) renderCandidates(card, f);
  if (f.type === 'duplicate') renderDuplicate(card, f);
  if (f.type === 'category_drift') renderDrift(card, f);
  if (f.relink_candidate) card.append(el('p', 'This file is a relink candidate for a missing Track.', 'rc-muted'));
  return card;
}

async function loadFindings() {
  const params = new URLSearchParams({ page, per_page: 25 });
  // With selections made, a refresh keeps the filters of the page shown: only navigate() (after asking) or a new
  // scan changes the page, so a control edited meanwhile never silently discards them.
  const f = (choices.size || driftChoices.size) ? { ...shown } : { t: document.getElementById('typeFilter').value,
    q: document.getElementById('search').value, open: document.getElementById('openOnly').checked };
  const t = f.t, q = f.q.trim();
  if (t) params.set('type', t);
  if (q) params.set('q', q);
  if (f.open) params.set('open', '1');
  if (t === 'category_drift') {
    if (driftFilter.folder !== null) params.set('folder', driftFilter.folder);
    if (driftFilter.category !== null) params.set('category', driftFilter.category);
    if (driftFilter.sort) params.set('sort', 'mismatch');
  }
  const gen = ++findingsGen;
  let resp, data;
  try {
    resp = await fetch('/api/tracks/reconciliation/findings/?' + params);
    data = await resp.json().catch(() => ({}));
  } catch (e) {
    resp = { ok: false }; data = {};
  }
  if (gen !== findingsGen) return;          // a newer findings request (new scan, filter or page) supersedes it
  const list = document.getElementById('findings');
  list.replaceChildren();
  if (!resp.ok) { list.append(el('p', data.error || 'Could not load findings.', 'rc-bad')); return; }
  page = data.page; pages = data.pages;
  shown = f;
  // Duplicate choices belong to one page of one scan: another page, filter or scan starts with none. Selections
  // are only ever dropped here when a newer scan replaced the report (or the page shown no longer exists): say so.
  const scope = [data.scan_id, data.page, t, q, params.get('open') || ''].join('|') +
    (t === 'category_drift' ? '|' + [params.get('folder'), params.get('category'), params.get('sort')].join('|') : '');
  if (scope !== choicesScope && driftChoices.size) {
    // Category-drift selections belong to one page of one scan too.
    const lostDrift = driftChoices.size;
    driftChoices = new Map();
    driftGen += 1;
    document.getElementById('driftPanel').hidden = true;
    updateDriftBar();
    const ok = actionButton('OK', () => { document.getElementById('navGuard').hidden = true; });
    showGuard([el('p', `The findings changed (a newer scan or another page), so your ${lostDrift} category-drift ` +
                       'selection(s) were cleared. Nothing was applied.', 'rc-warn'), ok]);
  }
  if (scope !== choicesScope) {
    const lost = choices.size, before = choicesScan;
    choicesScope = scope;
    choicesScan = data.scan_id;
    if (lost) {
      choices = new Map();
      resolveGen += 1;
      document.getElementById('resolvePanel').hidden = true;
      const ok = actionButton('OK', () => { document.getElementById('navGuard').hidden = true; });
      showGuard([el('p', before !== data.scan_id
        ? `A newer reconciliation scan (${data.scan_id}) replaced the report, so your ${lost} duplicate selection(s) ` +
          `from scan ${before} were cleared. Nothing was applied; review the new findings.`
        : `The findings page changed, so your ${lost} duplicate selection(s) were cleared. Nothing was applied.`,
        'rc-warn'), ok]);
    }
  }
  if (!data.items.length) list.append(el('p', data.scan_id ? 'No findings match.' : 'No completed scan yet.', 'rc-muted'));
  driftVisible = data.items.filter(f => f.type === 'category_drift');
  data.items.forEach(f => list.append(renderFinding(f)));
  renderDriftTools(data.drift_groups || (t === 'category_drift' ? driftGroups : null));
  if (t !== 'category_drift') { driftGroups = null; renderDriftTools(null); }
  document.getElementById('pageInfo').textContent = `Page ${page} of ${pages} (${data.total.toLocaleString()} findings)`;
  document.getElementById('prevBtn').disabled = page <= 1;
  document.getElementById('nextBtn').disabled = page >= pages;
  updateResolveBar();
}

document.getElementById('typeFilter').addEventListener('change', () => navigate(() => { page = 1; markChips(); }));
document.getElementById('openOnly').addEventListener('change', () => navigate(() => { page = 1; }));
document.getElementById('search').addEventListener('input', () => {
  clearTimeout(debounce);                     // asked once the typing pauses, not on every keystroke
  debounce = setTimeout(() => navigate(() => { page = 1; }), 300);
});
document.getElementById('prevBtn').addEventListener('click', () => navigate(() => { page -= 1; }));
document.getElementById('nextBtn').addEventListener('click', () => navigate(() => { page += 1; }));
refreshRun();
loadFindings();
</script>
{% endblock %}
