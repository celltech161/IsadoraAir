{% extends "base.html" %}

{% block title %}Library Reconciliation — IsadoraAir{% endblock %}

{% block extra_css %}
<style>
  .rc-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.75rem; margin-bottom: 0.75rem; }
  .rc-head h1 { font-size: 1.15rem; margin: 0; }
  .rc-head a { color: var(--accent); font-size: 0.8rem; }
  .rc-box {
    border: 1px solid var(--border-subtle); border-radius: 8px; background: var(--bg-dark);
    padding: 0.7rem 0.9rem; margin-bottom: 0.75rem; font-size: 0.82rem;
  }
  .rc-box p { margin: 0.2rem 0; }
  .rc-warn { color: #f59e0b; }
  .rc-bad { color: var(--danger); }
  .rc-muted { color: var(--text-muted); }
  .rc-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.75rem; overflow-wrap: anywhere; }
  .rc-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.75rem; }
  .rc-chip {
    background: var(--bg-dark); border: 1px solid var(--border-subtle); border-radius: 999px;
    color: var(--text-main); padding: 0.25rem 0.65rem; font-size: 0.76rem; cursor: pointer;
  }
  .rc-chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .rc-filters { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.6rem; font-size: 0.8rem; }
  .rc-filters input[type=text], .rc-filters select {
    background: var(--bg-dark); border: 1px solid var(--border-subtle); border-radius: 8px;
    color: var(--text-main); padding: 0.4rem 0.6rem; font-size: 0.8rem; min-width: 0; max-width: 100%;
  }
  .rc-filters input[type=text] { flex: 1 1 14rem; }
  .rc-card {
    border: 1px solid var(--border-subtle); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.5rem;
    font-size: 0.8rem; overflow-wrap: anywhere;
  }
  .rc-card h3 { font-size: 0.85rem; margin: 0 0 0.3rem; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
  .rc-badge {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; border-radius: 4px;
    padding: 0.1rem 0.4rem; border: 1px solid var(--border-subtle); color: var(--text-muted);
  }
  .rc-badge.t-missing, .rc-badge.t-uncertain { color: #f59e0b; border-color: rgba(245, 158, 11, 0.5); }
  .rc-badge.t-moved { color: var(--accent); border-color: var(--accent); }
  .rc-badge.t-protected { color: #60a5fa; border-color: rgba(96, 165, 250, 0.5); }
  .rc-table { border-collapse: collapse; width: 100%; min-width: 36rem; margin-top: 0.35rem; }
  .rc-table th, .rc-table td {
    text-align: left; padding: 0.25rem 0.4rem; border-bottom: 1px solid rgba(148, 163, 184, 0.12); vertical-align: top;
  }
  /* Cells break only an overlong word (a path), never ordinary words; narrow screens scroll the table. */
  .rc-table td { overflow-wrap: break-word; word-break: normal; }
  .rc-table th { color: var(--text-muted); font-weight: 600; white-space: nowrap; }
  .rc-table-wrap { overflow-x: auto; }
  .rc-btn {
    background: var(--bg-dark); border: 1px solid var(--border-subtle); border-radius: 6px; color: var(--text-main);
    padding: 0.25rem 0.6rem; font-size: 0.76rem; cursor: pointer;
  }
  .rc-btn:hover { border-color: var(--accent); }
  .rc-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .rc-pager { display: flex; justify-content: center; align-items: center; gap: 0.75rem; margin: 0.75rem 0; font-size: 0.8rem; }
  .rc-dialog { border-color: var(--accent); }
  .rc-run { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-bottom: 0.75rem; font-size: 0.82rem; }
  .rc-run .rc-btn { font-size: 0.82rem; padding: 0.4rem 0.8rem; }
  /* Narrow screens: tables scroll inside .rc-table-wrap; no column (and so no action) is ever hidden. */
  .rc-resolve { border: 1px solid var(--border-subtle); border-radius: 6px; padding: 0.4rem 0.6rem; margin: 0.45rem 0 0; }
  .rc-resolve legend { color: var(--text-muted); font-size: 0.76rem; padding: 0 0.3rem; }
  .rc-choice { display: block; padding: 0.15rem 0; cursor: pointer; }
  .rc-choice input { margin-right: 0.4rem; }
  .rc-ok { color: #22c55e; }
  .rc-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.5rem; }
  .rc-manual-warning { border-left: 3px solid #f59e0b; padding: 0.3rem 0.6rem; margin: 0.4rem 0; color: #f59e0b; }
  #resolveBar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
</style>
{% endblock %}

{% block content %}
<div class="rc-head">
  <h1>Library reconciliation</h1>
  <a href="{% url 'library:library' %}">&larr; Library</a>
</div>

<div class="rc-run">
  <button class="rc-btn" id="runBtn" type="button" disabled>Run reconciliation</button>
  <span id="runStatus" role="status" aria-live="polite"></span>
</div>
<div class="rc-box" id="scanStatus" role="status" aria-live="polite">Loading…</div>
<div class="rc-box rc-dialog" id="actionPanel" hidden></div>
<div class="rc-chips" id="counts" aria-label="Findings by type"></div>

<div class="rc-filters">
  <label for="typeFilter" class="rc-muted">Type</label>
  <select id="typeFilter">
    <option value="">All findings</option>
    {% for t in finding_types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
  </select>
  <input type="text" id="search" placeholder="Track ID, title, artist or file name" aria-label="Search findings">
  <label><input type="checkbox" id="openOnly" checked> Open duplicate groups only</label>
</div>

<div class="rc-filters" id="driftTools" hidden></div>
<div class="rc-box rc-dialog" id="navGuard" role="alert" hidden></div>
<div class="rc-box" id="driftBar" role="status" aria-live="polite" hidden></div>
<div class="rc-box rc-dialog" id="driftPanel" hidden></div>
<div class="rc-box" id="resolveBar" role="status" aria-live="polite" hidden></div>
<div class="rc-box rc-dialog" id="resolvePanel" hidden></div>
<div id="findings"></div>
<div class="rc-pager">
  <button class="rc-btn" id="prevBtn" type="button">&lsaquo; Prev</button>
  <span id="pageInfo" class="rc-muted"></span>
  <button class="rc-btn" id="nextBtn" type="button">Next &rsaquo;</button>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Everything shown here is text from the scan report or the database: it is only ever inserted with
// textContent / createTextNode, never as markup.
const TYPE_TEXT = {
  missing: 'Missing media', moved: 'Possible moved file', unregistered: 'Unregistered file',
  duplicate: 'Possible duplicate', category_drift: 'Category drift', shared_source: 'Shared / reused source',
  protected: 'Protected (other subsystem)', in_delivery: 'May still be arriving', uncertain: 'Uncertain',
};
let page = 1, pages = 1, debounce = null, scanId = null;
// Generations: each status or findings request takes the next number, and its answer is committed (rendered,
// or stored in scanId, launch, the message, the button) only if no newer request, or a launch, has been
// started since. So an older response that arrives late can never overwrite a newer one.
let statusGen = 0, findingsGen = 0;
const STALE = Symbol('stale');

function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = String(text);
  if (cls) node.className = cls;
  return node;
}
function getCookie(name) {
  const hit = document.cookie.split(';').map(c => c.trim()).find(c => c.startsWith(name + '='));
  return hit ? decodeURIComponent(hit.slice(name.length + 1)) : null;
}
function fmtSize(n) {
  if (n === null || n === undefined) return '—';
  const units = ['B', 'kB', 'MB', 'GB'];
  let i = 0, v = n;
  while (v >= 1000 && i < units.length - 1) { v /= 1000; i += 1; }
  return (i ? v.toFixed(1) : v) + ' ' + units[i];
}
function fmtDuration(sec) {
  if (sec === null || sec === undefined) return '—';
  const total = Math.round(sec), m = Math.floor(total / 60);
  return m + ':' + String(total - m * 60).padStart(2, '0');
}
function trackLink(track) {
  const a = el('a', `#${track.id}`);
  a.href = `/track/${encodeURIComponent(track.id)}/`;
  return a;
}

async function loadSummary(gen) {
  const box = document.getElementById('scanStatus');
  let resp, data;
  try {
    resp = await fetch('/api/tracks/reconciliation/');
    data = await resp.json().catch(() => ({}));
  } catch (e) {
    resp = { ok: false }; data = {};
  }
  if (gen !== statusGen) return STALE;      // superseded while in flight: commit nothing
  box.replaceChildren();
  if (!resp.ok) { box.append(el('p', data.error || 'Could not load the scan status.', 'rc-bad')); return null; }
  const st = data.status || {}, report = data.report;
  if (st.running) {
    box.append(el('p', st.running.alive
      ? `A scan is running (${st.running.phase}, ${st.running.done} done).`
      : 'A scan stopped before finishing (interrupted). Its partial results are not shown.', st.running.alive ? '' : 'rc-warn'));
  }
  if (st.last_attempt && (!st.latest || st.last_attempt.scan_id !== st.latest.scan_id)) {
    box.append(el('p', `The most recent scan (${st.last_attempt.scan_id}) did not complete: ${st.last_attempt.status}.`, 'rc-bad'));
  }
  if (!report) {
    box.append(el('p', 'No completed scan yet.'));
  } else {
    scanId = report.scan_id;
    box.append(el('p', `Latest completed scan ${report.scan_id}, finished ${new Date(report.finished_at).toLocaleString()}, ` +
                       `of ${report.library_root}.`));
    if (report.status === 'suspect') box.append(el('p', 'Storage suspect: ' + report.status_reason, 'rc-bad'));
    const c = report.counts;
    box.append(el('p', `${c.tracks_total.toLocaleString()} Tracks (${c.healthy.toLocaleString()} healthy), ` +
      `${c.files_total.toLocaleString()} audio files, ${c.relink_reviewable} relink(s) ready for review, ` +
      `${c.duplicate_groups_open} open duplicate group(s).`));
    if (c.unsupported_files) box.append(el('p', `${c.unsupported_files} other file(s) not audio the Library imports.`, 'rc-muted'));
    (report.errors || []).forEach(e => box.append(el('p', 'Note: ' + e, 'rc-warn')));
    const chips = document.getElementById('counts');
    chips.replaceChildren();
    const all = el('button', 'All', 'rc-chip');
    all.type = 'button';
    all.addEventListener('click', () => setType(''));
    chips.append(all);
    Object.keys(TYPE_TEXT).forEach(t => {
      const chip = el('button', `${TYPE_TEXT[t]}: ${(c[t] || 0).toLocaleString()}`, 'rc-chip');
      chip.type = 'button';
      chip.dataset.type = t;
      chip.addEventListener('click', () => setType(t));
      chips.append(chip);
    });
    markChips();
  }
  box.append(el('p', 'Scans are read only: they change no Track, file or setting, and write only a new report.', 'rc-muted'));
  return st;
}

// ---- Run reconciliation. The server starts manage.py reconcile_library; everything shown about it comes from
// the scan's own status (the summary API above), so a refresh or a second tab sees the same scan, and leaving
// the page does not stop it. `launch` is only this page's memory of the scan it started.
let launch = null, starting = false, pollTimer = null, shownScan, lastStatus = null;

// runView:begin -- pure: the button and the message, from the status and this page's launch (tested under Node).
// `launch` holds what existed before it (the last attempt's scan_id and the progress file's identity, both
// recorded by the server under its launch lock), so an older report or an older progress file is never taken
// for this launch's. `seen` is the last time there was evidence of a new scan; `confirmed` that there was any.
const START_GRACE_MS = 30000;      // a launch must show a new scan or a new result within this
const UNKNOWN_LAUNCH_TEXT = 'No answer from the server, so whether the scan started is not known. The scan status ' +
                            'here updates automatically; check it before trying again.';
function runKey(running) { return running ? `${running.pid}:${running.started}` : null; }
function observe(st, launch, now) {
  if (launch && st && st.running && st.running.alive && runKey(st.running) !== launch.previousRunning) {
    launch.seen = now;
    launch.confirmed = true;
  }
}
function runView(st, launch, now) {
  if (st === null) return { busy: true, done: false, cls: 'rc-bad', text: 'The scan status cannot be determined right now.' };
  const running = st.running || null, attempt = st.last_attempt || null;
  if (running && running.alive) {
    return { busy: true, done: false, cls: '', text: `A scan is running (${running.phase}, ${running.done} done).` };
  }
  if (!launch) return { busy: false, done: false, cls: '', text: '' };
  if (attempt && attempt.scan_id !== launch.previous) {
    if (attempt.status === 'complete' || attempt.status === 'suspect') {
      return { busy: false, done: true, refresh: true, cls: attempt.status === 'suspect' ? 'rc-warn' : '',
               text: `Scan ${attempt.scan_id} finished (${attempt.status}). The summary and findings below are from it.` };
    }
    return { busy: false, done: true, cls: 'rc-bad',
             text: `Scan ${attempt.scan_id} failed. Nothing was replaced: the findings below are still from the previous complete scan.` };
  }
  if (running && runKey(running) !== launch.previousRunning) {
    return { busy: false, done: true, cls: 'rc-warn',
             text: 'The scan stopped before it finished (for example, the web application restarted, or the scan reached ' +
                   'its two-hour limit). Nothing was replaced: the findings below are still from the previous complete scan.' };
  }
  if (now - launch.seen < START_GRACE_MS) {
    return { busy: true, done: false, cls: launch.unknown ? 'rc-warn' : '',
             text: launch.confirmed ? 'Waiting for the scan’s result…'
                                    : launch.unknown ? UNKNOWN_LAUNCH_TEXT : 'Starting the scan…' };
  }
  // No evidence either way: say so, without claiming a failure. Kept as this page's launch, so a late scan or
  // result is still recognised; a retry is safe (the scanner's lock allows one scan at a time).
  if (launch.confirmed) {
    return { busy: false, done: false, cls: 'rc-warn',
             text: 'The scan is no longer running and no new result was detected. Nothing was replaced. Check status before trying again.' };
  }
  return { busy: false, done: false, cls: 'rc-warn',
           text: 'Start not confirmed. No scan activity or result was detected. Check status before trying again.' };
}
// runView:end

async function refreshRun() {
  clearTimeout(pollTimer);
  pollTimer = null;
  if (starting) return;                      // paused while the launch request is underway; it resumes polling
  const gen = ++statusGen;
  const st = await loadSummary(gen);
  if (st === STALE || gen !== statusGen) return;   // a newer refresh, or a launch, owns the page now
  lastStatus = st;
  observe(st, launch, Date.now());
  const view = runView(st, launch, Date.now());
  document.getElementById('runBtn').disabled = view.busy || starting;
  const msg = document.getElementById('runStatus');
  msg.textContent = view.text;
  msg.className = view.cls;
  if (view.done) launch = null;
  if (shownScan !== undefined && scanId !== shownScan) { page = 1; loadFindings(); }   // a new complete report, once
  shownScan = scanId;
  pollTimer = setTimeout(refreshRun, view.busy ? 2000 : 15000);
  return view;
}

// The optional decoded-audio verification of likely duplicate pairs: one of the server's fixed choices (the
// server refuses anything else). Off by default: a normal scan decodes no audio for duplicates.
const VERIFY_AUDIO_CHOICES = [[0, 'Off'], [25, 'Up to 25 pairs'], [50, 'Up to 50 pairs'], [100, 'Up to 100 pairs']];
function confirmRun() {
  const start = el('button', 'Start read-only scan', 'rc-btn');
  start.type = 'button';
  const verify = el('select');
  verify.id = 'verifyAudio';
  VERIFY_AUDIO_CHOICES.forEach(([value, text]) => { const o = el('option', text); o.value = String(value); verify.append(o); });
  verify.value = '0';
  const verifyLabel = el('label', 'Verify audio for likely duplicates: ');
  verifyLabel.setAttribute('for', 'verifyAudio');
  const verifyRow = el('p', undefined, 'rc-filters');
  verifyRow.append(verifyLabel, verify);
  start.addEventListener('click', async () => {
    if (starting) return;                    // one request, however often it is clicked
    starting = true;
    statusGen += 1;                          // status answers already in flight are stale now: none is committed
    clearTimeout(pollTimer);                 // and polling pauses until the launch has its answer
    pollTimer = null;
    const before = lastStatus;               // the last status this page showed, before the launch
    start.disabled = true;
    document.getElementById('runBtn').disabled = true;
    document.getElementById('actionPanel').hidden = true;
    const msg = document.getElementById('runStatus');
    msg.textContent = 'Starting the scan…';
    msg.className = '';
    let result;
    try {
      result = await postJSON('/api/tracks/reconciliation/run/', { verify_audio_pairs: Number(verify.value) || 0 });
    } catch (e) {
      result = { resp: { ok: false, status: 0 }, data: {} };
    }
    starting = false;
    // No answer, or a server error without the launcher's own refusal code: the scan may or may not have
    // started. Not reported as "not started"; watched like a 202 "starting", from the status shown before.
    const unknown = !result.resp.ok && !result.data.code && (result.resp.status === 0 || result.resp.status >= 500);
    if (result.resp.ok) {
      const prev = result.data.previous_attempt;
      launch = { previous: prev ? prev.scan_id : null, previousRunning: runKey(result.data.previous_running),
                 seen: Date.now(), confirmed: result.data.state === 'running' };
    } else if (unknown && before) {
      launch = { previous: before.last_attempt ? before.last_attempt.scan_id : null,
                 previousRunning: runKey(before.running), seen: Date.now(), confirmed: false, unknown: true };
    } else {
      launch = null;
    }
    const refreshed = await refreshRun();    // resumes polling, whatever the answer was
    const definitive = refreshed && (refreshed.done || (lastStatus && lastStatus.running && lastStatus.running.alive));
    if (!result.resp.ok && !unknown) {
      msg.textContent = 'Not started: ' + (result.data.error || `HTTP ${result.resp.status}`);
      msg.className = result.resp.status === 409 ? 'rc-warn' : 'rc-bad';
    } else if (unknown && !launch && !definitive) {
      msg.textContent = UNKNOWN_LAUNCH_TEXT;
      msg.className = 'rc-warn';
    }
  });
  showPanel([el('p', 'Run a reconciliation scan now? It only reads the Library: no Track, file or setting is ' +
                     'changed, and it writes a new report. It can take several minutes; you can leave this page.'),
             verifyRow,
             el('p', 'Verifying decodes the audio of likely duplicate pairs (two Tracks, same artist and title or ' +
                     'ISRC) that no trusted waveform already identifies, at most two files per pair, to prove whether ' +
                     'they are the same recording; files are only read. Each decode takes a few seconds, and the ' +
                     'verification stops after 30 minutes in all. Pairs whose decoded audio is identical can then be ' +
                     'resolved here.', 'rc-muted'),
             start, closeButton('Cancel')]);
}
document.getElementById('runBtn').addEventListener('click', confirmRun);

function setType(t) {
  document.getElementById('typeFilter').value = t;
  navigate(() => { page = 1; markChips(); });
}
function markChips() {
  const t = document.getElementById('typeFilter').value;
  document.querySelectorAll('#counts .rc-chip').forEach(c => c.setAttribute('aria-pressed', String((c.dataset.type || '') === t)));
}

function trackTable(rows, columns) {
  const wrap = el('div', undefined, 'rc-table-wrap');
  const table = el('table', undefined, 'rc-table');
  const head = el('tr');
  columns.forEach(([label]) => head.append(el('th', label)));
  table.append(head);
  rows.forEach(r => {
    const tr = el('tr');
    columns.forEach(([, render]) => {
      const td = el('td');
      const value = render(r);
      if (value instanceof Node) td.append(value); else td.textContent = value === undefined || value === null ? '' : String(value);
      tr.append(td);
    });
    table.append(tr);
  });
  wrap.append(table);
  return wrap;
}

function renderTrack(card, track) {
  card.append(trackTable([track], [
    ['Track', t => trackLink(t)], ['Title', t => t.title], ['Artist', t => t.artist], ['Category', t => t.category],
    ['Duration', t => fmtDuration(t.duration)], ['Format', t => t.format], ['Ready', t => t.ready2air ? 'yes' : 'no'],
  ]));
  card.append(el('p', 'File: ' + (track.filepath || '(none)'), 'rc-code'));
  if (track.file_hash) card.append(el('p', 'Historical byte hash (may be stale): ' + track.file_hash.slice(0, 16) + '…', 'rc-muted'));
}

function renderCandidates(card, finding) {
  card.append(el('p', 'Candidate files:'));
  card.append(trackTable(finding.candidates.map((c, i) => ({ ...c, index: i })), [
    ['File', c => c.rel], ['Size', c => fmtSize(c.size)], ['Name matches', c => c.name_matches ? 'yes' : 'no'],
    ['Decoded audio', c => c.identity_match === true ? 'identical' : c.identity_match === false ? 'different' : 'not compared'],
    ['Assessment', c => c.eligible ? 'Can be relinked after review' : (c.reasons || []).join('; ')],
    ['', c => relinkControl(finding, c)],
  ]));
  const ev = (finding.track || {}).evidence || {};
  (ev.problems || []).forEach(p => card.append(el('p', 'Why relink is not available: ' + p, 'rc-warn')));
}

function relinkControl(finding, candidate) {
  // Offered only for the one candidate the scan proved to carry the Track's decoded audio.
  if (finding.relink !== candidate.index) return '';
  const button = el('button', 'Review relink…', 'rc-btn');
  button.type = 'button';
  button.addEventListener('click', () => previewRelink(finding));
  return button;
}

function postJSON(url, payload) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
    body: JSON.stringify(payload),
  }).then(async resp => ({ resp, data: await resp.json().catch(() => ({})) }));
}

function showPanel(nodes) {
  const panel = document.getElementById('actionPanel');
  panel.replaceChildren(...nodes);
  panel.hidden = false;
  panel.scrollIntoView({ block: 'nearest' });
}

async function previewRelink(finding) {
  const { resp, data } = await postJSON('/api/tracks/reconciliation/relink/preview/', { scan_id: scanId, finding_id: finding.id });
  if (!resp.ok) { showPanel([el('p', 'Relink refused: ' + (data.error || resp.status), 'rc-bad'), closeButton()]); return; }
  const nodes = [el('p', `Relink Track #${data.track_id}: ${data.evidence}.`)];
  nodes.push(trackTable(data.changes, [['Field', c => c.field], ['Now', c => c.before], ['After', c => c.after]]));
  nodes.push(el('p', 'Unchanged: ' + data.unchanged.join('; ') + '.', 'rc-muted'));
  data.warnings.forEach(w => nodes.push(el('p', w, 'rc-warn')));
  const confirm = el('button', 'Confirm relink', 'rc-btn');
  confirm.type = 'button';
  confirm.addEventListener('click', async () => {
    confirm.disabled = true;
    const result = await postJSON('/api/tracks/reconciliation/relink/apply/', { token: data.token });
    const ok = result.resp.ok && result.data.result === 'relinked';
    showPanel([el('p', ok ? `Relinked Track #${result.data.track_id} to ${result.data.to}.`
                          : 'Relink refused, nothing was changed: ' + (result.data.error || result.resp.status),
                  ok ? '' : 'rc-bad'),
               ...(ok ? result.data.warnings.map(w => el('p', w, 'rc-warn')) : []), closeButton()]);
  });
  nodes.push(confirm, closeButton('Cancel'));
  showPanel(nodes);
}

function closeButton(label) {
  const b = el('button', label || 'Close', 'rc-btn');
  b.type = 'button';
  b.addEventListener('click', () => { document.getElementById('actionPanel').hidden = true; });
  return b;
}

// evidence:begin -- pure: how the page names a pair's proof (tested under Node). Exact file match and verified
// decoded-audio match are never presented as the same thing, and a decoded-audio match never claims that the
// files, their tags, cue points or other Track details are identical.
const BYTES_TEXT = {
  different_size: 'The two files are different (different sizes)',
  different_bytes: 'The two files are different (same size, different bytes)',
  identical_bytes: 'The two files are also byte-identical',
  not_compared: 'The two files were not compared byte for byte',
};
function evidenceText(ev) {
  if (!ev) return '';
  if (ev.kind === 'exact_bytes') return 'Exact file match: both files have identical bytes (SHA-256 checked in this scan).';
  if (ev.kind === 'decoded_audio') {
    return 'Verified decoded-audio match: both files decode to identical audio (same digest, ' +
           `${ev.sample_rate} Hz, ${ev.frames} frames). ${BYTES_TEXT[ev.bytes] || BYTES_TEXT.not_compared}; their ` +
           'tags, artwork, cue points and other Track details may differ. Nothing is merged: the kept Track stays ' +
           'as it is, except for the categories you choose to add.';
  }
  if (ev.kind === 'manual_editorial') {
    return 'Manual editorial decision: the scan did not verify these recordings as identical. Nothing is merged: the ' +
           'kept Track stays as it is, except for the categories you choose to add.';
  }
  return '';
}
// What the scan established about a manually reviewed pair's audio: never presented as a successful comparison.
function manualAudioText(m) {
  if (!m) return '';
  if (m.audio === 'different') {
    return 'The scan decoded both files and their audio differs' + (m.audio_reason ? ` (${m.audio_reason})` : '') +
           ': they are different recordings, edits or masters.';
  }
  if (m.audio === 'unverified') return 'The decoded audio was not verified: ' + (m.audio_reason || 'no reason recorded') + '.';
  return 'The decoded audio of these files was not compared.';
}
function identitySourceText(source) {
  return source === 'decoded' ? 'decoded in this scan' : source === 'waveform_cache' ? 'trusted waveform cache' : '—';
}
// evidence:end

function audioVerificationNodes(av) {
  if (av.status === 'verified') {
    const nodes = [el('p', 'Verified decoded-audio match: ' + (av.reason || 'decoded audio identical') + '. ' +
                           (BYTES_TEXT[av.bytes] || BYTES_TEXT.not_compared) + '; tags, artwork, cue points and ' +
                           'other Track details may differ.', 'rc-ok')];
    nodes.push(trackTable(av.files || [], [
      ['File', f => f.rel], ['Size', f => fmtSize(f.size)], ['Track', f => trackLink({ id: f.track_id })],
      ['Decoded audio', f => (f.identity.sha256 || '').slice(0, 16) + '…'],
      ['Rate', f => `${f.identity.sample_rate} Hz`], ['Length', f => fmtDuration(f.identity.frames / f.identity.sample_rate)],
      ['Identified by', f => identitySourceText(f.identity_source)],
    ]));
    return nodes;
  }
  if (av.status === 'different') {
    return [el('p', 'Decoded audio compared: ' + (av.reason || 'it differs') + '. These are different recordings or ' +
                    'edits; they cannot be resolved as duplicates here.', 'rc-warn')];
  }
  return [el('p', 'Decoded audio: ' + (av.reason || 'not verified') + '.', 'rc-muted')];
}

function renderDuplicate(card, finding) {
  // Two separate review needs: registered Track pairs (recorded decisions) and unregistered files (a file review,
  // never a Track pair, and nothing this page acts on).
  const unregistered = finding.unregistered_file_count || 0;
  const status = [];
  if (finding.pair_count) {
    status.push(finding.track_pair_review_open
      ? `Track-pair review pending (${finding.keep_both_decision_count || 0} of ${finding.pair_count} pairs reviewed as not duplicates)`
      : 'Track pairs reviewed: not duplicates');
  }
  if (unregistered) status.push(`${unregistered.toLocaleString()} unregistered file(s) require review`);
  if (status.length) card.append(el('p', status.join(' · '), finding.open ? 'rc-warn' : 'rc-muted'));
  if (finding.members_truncated) card.append(el('p',
    `Showing ${finding.members_returned.toLocaleString()} of ${finding.member_count.toLocaleString()} member Tracks; ` +
    'the group remains open and the complete count is retained in the scan.', 'rc-warn'));
  if (finding.files) {
    card.append(trackTable(finding.files, [
      ['File', f => f.rel], ['Size', f => fmtSize(f.size)],
      ['Track', f => f.track_id ? trackLink({ id: f.track_id }) : 'unregistered — requires review'],
      ['SHA-256', f => (f.sha256 || '').slice(0, 16) + '…'],
    ]));
    if (finding.files_truncated) card.append(el('p',
      `Showing ${finding.files_returned.toLocaleString()} of ${finding.file_count.toLocaleString()} files.`, 'rc-warn'));
    if (unregistered) card.append(el('p',
      'Unregistered files have the same bytes as the files listed with them. That does not mean they should be ' +
      'deleted: one may be a delivery awaiting import, a retained or backup copy, or another subsystem\'s audio. ' +
      'This page never deletes, imports or merges files; review them by hand.', 'rc-muted'));
  }
  if (finding.audio_verification) audioVerificationNodes(finding.audio_verification).forEach(n => card.append(n));
  if (finding.tracks && finding.tracks.length) {
    const pairNames = (finding.resolution || {}).deletable && (finding.members || []).length === 2;
    card.append(trackTable(finding.tracks, [
      ...(pairNames ? [['', t => t.id === finding.members[0] ? 'A' : 'B']] : []),
      ['Track', t => t.deleted ? `#${t.id} (deleted)` : trackLink(t)], ['Title', t => t.title], ['Artist', t => t.artist],
      ['Album', t => t.album], ['Duration', t => fmtDuration(t.duration)],
      ['Format', t => [t.format, t.sample_rate && `${t.sample_rate} Hz`, t.channels && `${t.channels} ch`, t.bit_depth && `${t.bit_depth}-bit`].filter(Boolean).join(', ')],
      ['Size', t => t.file_present ? fmtSize(t.size) : 'missing'], ['Directory', t => t.directory],
      ['Categories', t => [t.category, ...(t.additional_categories || [])].filter(Boolean).join(', ')],
      ['References', t => `${t.playlist_refs} playlist, ${t.rotation_refs} rotation, ${t.upcoming_log_items} upcoming log, ${t.voicetracks} voice track, ${t.play_count} plays`],
      ['Hash (historical)', t => t.historical_file_hash ? t.historical_file_hash.slice(0, 12) + '…' : '—'],
    ]));
  }
  const decisions = Object.entries(finding.decisions || {});
  decisions.forEach(([pair, d]) => card.append(el('p', `Pair ${pair}: ${d.resolution === 'keep_both' ? 'reviewed — not a duplicate' : d.resolution}` +
    (d.applied ? ' (applied)' : ''), d.resolution === 'keep_both' ? 'rc-muted' : 'rc-warn')));
  if (finding.decisions_truncated) card.append(el('p',
    `Showing ${finding.decisions_returned.toLocaleString()} of ${finding.decision_count.toLocaleString()} recorded decisions.`, 'rc-warn'));
  if ((finding.pending_deletion_decisions || []).length) {
    card.append(el('p', 'A recorded keep/delete decision exists for ' + finding.pending_deletion_decisions.join(', ') +
      '. Applying it with apply_duplicate_resolutions would delete a Track. This page never applies it; deleting ' +
      'a Track here (after your own choice and confirmation) removes that Track\'s recorded decisions.', 'rc-warn'));
  }
  if (finding.pending_deletion_decision_count > (finding.pending_deletion_decisions || []).length) {
    card.append(el('p', `${finding.pending_deletion_decision_count.toLocaleString()} pending keep/delete decisions ` +
      'exist in this group; the response lists only a bounded sample. This page never applies them.', 'rc-warn'));
  }
  const resolution = finding.resolution || {};
  if (resolution.deletable && (finding.members || []).length === 2) {
    if (finding.evidence) card.append(el('p', evidenceText(finding.evidence), 'rc-muted'));
    card.append(resolutionControl(finding));
  } else if ((finding.manual || {}).available) {
    if (resolution.reason) card.append(el('p', 'Not verified as identical: ' + resolution.reason + '.', 'rc-muted'));
    card.append(manualControl(finding));
  } else if ((finding.member_count || 0) >= 2 && (finding.members || []).length >= 2) {
    if (resolution.reason) card.append(el('p', 'Review only: ' + resolution.reason + '.', 'rc-muted'));
    if (finding.manual && finding.manual.reason) {
      card.append(el('p', 'Manual resolution is not available: ' + finding.manual.reason + '.', 'rc-muted'));
    }
    card.append(notDuplicateControl(finding));
  } else if (unregistered) {
    card.append(el('p', 'File review only: fewer than two registered Tracks, so there is no Track-pair decision to record.',
                   'rc-muted'));
  }
}

function notDuplicateControl(finding) {
  // The only decision this page records: two Tracks are not duplicates (nothing is deleted or merged).
  const row = el('div', undefined, 'rc-filters');
  const pick = (label, index) => {
    const select = el('select');
    select.setAttribute('aria-label', label);
    finding.members.forEach(id => { const o = el('option', `#${id}`); o.value = id; select.append(o); });
    select.selectedIndex = Math.min(index, finding.members.length - 1);
    return select;
  };
  const first = pick('First Track of the pair', 0), second = pick('Second Track of the pair', 1);
  const button = el('button', 'Record: not a duplicate', 'rc-btn');
  button.type = 'button';
  const result = el('span', undefined, 'rc-muted');
  result.setAttribute('role', 'status');
  button.addEventListener('click', async () => {
    if (first.value === second.value) { result.textContent = 'Choose two different Tracks.'; return; }
    button.disabled = true;
    const resp = await fetch('/api/tracks/reconciliation/duplicates/not-duplicate/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
      body: JSON.stringify({ scan_id: scanId, finding_id: finding.id, track_a: Number(first.value), track_b: Number(second.value) }),
    });
    const data = await resp.json().catch(() => ({}));
    button.disabled = false;
    result.textContent = !resp.ok ? (data.error || 'Not recorded.')
      : data.result === 'recorded' ? 'Recorded: not a duplicate. The group closes at the next scan.'
      : `Already decided (${data.resolution}); left unchanged.`;
  });
  row.append(el('span', 'Pair:', 'rc-muted'), first, second, button, result);
  return row;
}

// ---- Duplicate resolution (roadmap 3.12). Only two-Track findings the server marks deletable offer it: exact
// file matches, and pairs whose decoded audio the scan verified identical.
// `choices` holds the operator's explicit choice per finding of THIS page (finding id -> choice); nothing is
// chosen by default. A preview shows what would happen and returns a token; apply sends that token with the
// operator's per-pair options (included or cancelled, categories to add, voice-track acknowledgment). The
// server rechecks everything and trusts none of it beyond being a subset of what it suggested.
let choices = new Map(), choicesScope = null, resolveGen = 0, resolveBusy = false;

// resolve:begin -- pure helpers (tested under Node).
function choiceFor(value, a, b) {
  if (value === 'keep_a') return { action: 'delete', keep: a, discard: b };
  if (value === 'keep_b') return { action: 'delete', keep: b, discard: a };
  if (value === 'keep_both') return { action: 'keep_both' };
  return null;
}
// A manual editorial choice: always an explicit pair of two different Tracks of the finding, and a deletion
// carries the operator's acknowledgment (false until ticked; the server issues no authorization without it).
function manualChoice(value, a, b, ack) {
  if (!a || !b || a === b) return null;
  const pair = [a, b];
  if (value === 'keep_a') return { action: 'delete', keep: a, discard: b, manual: true, pair, ack: ack === true };
  if (value === 'keep_b') return { action: 'delete', keep: b, discard: a, manual: true, pair, ack: ack === true };
  if (value === 'keep_both') return { action: 'keep_both', manual: true, pair };
  return null;
}
function choiceKey(choice, a, b) {
  if (!choice) return 'none';
  if (choice.pair && !(choice.pair[0] === a && choice.pair[1] === b)) return 'none';
  if (choice.action === 'keep_both') return 'keep_both';
  return choice.keep === a && choice.discard === b ? 'keep_a' : choice.keep === b && choice.discard === a ? 'keep_b' : 'none';
}
function selectionsPayload(map) {
  return [...map.entries()].map(([id, c]) => {
    if (c.action === 'keep_both') {
      return c.manual ? { finding_id: id, action: 'keep_both', tracks: [...c.pair] } : { finding_id: id, action: 'keep_both' };
    }
    const sel = { finding_id: id, action: 'delete', keep: c.keep, discard: c.discard };
    return c.manual ? { ...sel, authority: 'manual_editorial', acknowledge_manual: c.ack === true } : sel;
  });
}
function manualCounts(map) {
  let manual = 0, unacknowledged = 0;
  map.forEach(c => { if (c.manual && c.action === 'delete') { manual += 1; if (c.ack !== true) unacknowledged += 1; } });
  return { manual, unacknowledged };
}
// Per-pair options the operator sets in the preview: deletions start included with every suggested category
// ticked; one that needs a voice-track acknowledgment starts undecided (neither cancelled nor acknowledged).
function initialOptions(preview) {
  const options = new Map();
  preview.items.forEach(item => {
    if (item.status === 'blocked') return;
    options.set(item.finding_id, item.action === 'keep_both' ? { include: true }
      : { include: item.status !== 'needs_acknowledgment', ack: null,
          categories: new Set((item.suggested_categories || []).map(c => c.id)),
          ...(item.authority === 'manual_editorial' ? { manualAck: item.manual_acknowledged === true } : {}) });
  });
  return options;
}
function readiness(preview, options) {
  let deletions = 0, keeps = 0, undecided = 0;
  preview.items.forEach(item => {
    const o = options.get(item.finding_id);
    if (!o) return;
    if (item.action === 'keep_both') { if (o.include) keeps += 1; return; }
    if (item.status === 'needs_acknowledgment' && o.ack === null) { undecided += 1; return; }
    if (o.include) deletions += 1;
  });
  return { deletions, keeps, undecided, ready: undecided === 0 && deletions + keeps > 0 };
}
// The confirmed batch, in preview order: one apply request per included pair, each with that pair's own
// single-use token (so no request ever deletes more than one Track). Unticked or cancelled pairs are never sent.
function applyQueue(preview, options) {
  const send = [], cancelled = [];
  preview.items.forEach(item => {
    const o = options.get(item.finding_id);
    if (!o || !item.token) return;
    if (!o.include) {
      cancelled.push({ finding_id: item.finding_id, action: item.action, outcome: 'cancelled',
                       message: 'Cancelled: nothing was changed for this pair.' });
      return;
    }
    send.push({ finding_id: item.finding_id, action: item.action, token: item.token,
                choice: item.action === 'keep_both' ? {}
                  : { categories: [...o.categories], acknowledge_voicetracks: o.ack === 'delete',
                      ...(item.authority === 'manual_editorial' ? { acknowledge_manual: o.manualAck === true } : {}) } });
  });
  return { send, cancelled };
}
// One pair's answer: its result; a refusal (nothing was applied); or null when the answer was lost or unreadable,
// so whether the pair was applied is not known -- the batch then stops rather than send anything more.  Every 5xx
// is such an answer, whatever its body: the server refuses with 4xx only, and a proxy's 502/504 (or a worker that
// failed after the commit) can follow a deletion that did happen.
function applyAnswer(job, resp, data) {
  if (resp.ok) return data && data.item ? data.item : null;
  if (!resp.status || resp.status >= 500) return null;
  return { finding_id: job.finding_id, action: job.action, outcome: 'refused',
           message: 'Not applied: ' + ((data && data.error) || `HTTP ${resp.status}`) };
}
function outcomeCounts(items) {
  const counts = {};
  items.forEach(r => { counts[r.outcome] = (counts[r.outcome] || 0) + 1; });
  return counts;
}
// After apply: resolved, recorded and cancelled pairs leave the selection; blocked, stale, refused, failed, unknown
// or unsent ones stay selected for review and a later preview.
const SETTLED = new Set(['deleted', 'recorded', 'already_decided', 'cancelled']);
function choicesAfterApply(map, items) {
  const next = new Map(map);
  items.forEach(r => { if (SETTLED.has(r.outcome)) next.delete(r.finding_id); });
  return next;
}
// resolve:end

function setChoice(findingId, value, a, b) {
  const choice = choiceFor(value, a, b);
  if (choice) choices.set(findingId, choice); else choices.delete(findingId);
  updateResolveBar();
}

function resolutionControl(finding) {
  const [a, b] = finding.members;
  const box = el('fieldset', undefined, 'rc-resolve');
  const gone = (finding.tracks || []).filter(t => t.deleted).map(t => t.id);
  if (gone.length) {
    choices.delete(finding.id);
    box.append(el('p', `Track #${gone.join(', #')} no longer exists (deleted after this scan). Run a new scan to ` +
                       'update this finding.', 'rc-muted'));
    return box;
  }
  box.append(el('legend', `Resolve this pair (A is #${a}, B is #${b})`));
  const current = choiceKey(choices.get(finding.id), a, b);
  [['none', 'No action'], ['keep_a', `Keep A (#${a}), discard B (#${b})`], ['keep_b', `Keep B (#${b}), discard A (#${a})`],
   ['keep_both', 'Keep both intentionally (not duplicates)']].forEach(([value, text]) => {
    const label = el('label', undefined, 'rc-choice');
    const input = el('input');
    input.type = 'radio';
    input.name = 'resolve-' + finding.id;
    input.value = value;
    input.checked = value === current;
    input.addEventListener('change', () => { if (input.checked) setChoice(finding.id, value, a, b); });
    label.append(input, el('span', text));
    box.append(label);
  });
  box.append(el('p', 'Nothing happens until you review the selection and confirm it. Listen to both on their Track ' +
                     'pages first if you are unsure.', 'rc-muted'));
  return box;
}

// ---- Manual review (3.11): an operator's editorial decision for a finding the scan could not prove. One
// explicitly chosen pair per finding; a deletion needs the operator's own acknowledgment before the server
// authorizes it, and then follows exactly the same preview, confirmation and checks as any other deletion.
const manualOpen = new Set(), manualPairs = new Map();
function setManualChoice(findingId, choice) {
  if (choice) choices.set(findingId, choice); else choices.delete(findingId);
  // A preview on screen no longer matches the selection: it is withdrawn, and Review selected… asks again.
  resolveGen += 1;
  if (!resolveBusy) document.getElementById('resolvePanel').hidden = true;
  updateResolveBar();
}

function manualControl(finding) {
  const m = finding.manual;
  const wrap = el('div');
  const live = (finding.tracks || []).filter(t => !t.deleted && (m.members || []).includes(t.id)).map(t => t.id);
  const gone = (finding.tracks || []).filter(t => t.deleted).map(t => t.id);
  if (live.length < 2) {
    choices.delete(finding.id);
    wrap.append(el('p', 'Fewer than two of this group\'s Tracks remain to review here. Run a new scan to update this finding.',
                   'rc-muted'));
    return wrap;
  }
  const box = el('fieldset', undefined, 'rc-resolve');
  box.hidden = !(manualOpen.has(finding.id) || choices.has(finding.id));
  const toggle = actionButton('Review & Resolve Manually', () => {
    box.hidden = !box.hidden;
    if (box.hidden) manualOpen.delete(finding.id); else manualOpen.add(finding.id);
  });
  wrap.append(toggle, box);
  box.append(el('legend', 'Manual review: your editorial decision'));
  if (gone.length) box.append(el('p', `Track #${gone.join(', #')} was deleted after this scan; choose among the remaining Tracks.`, 'rc-muted'));
  const existing = choices.get(finding.id);
  if (existing && existing.pair && !(live.includes(existing.pair[0]) && live.includes(existing.pair[1]))) choices.delete(finding.id);
  const chosen = choices.get(finding.id);
  let pair = live.length === 2
    ? (chosen && chosen.pair && chosen.pair.every(id => live.includes(id)) ? [...chosen.pair] : [...live])
    : chosen && chosen.pair ? [...chosen.pair] : manualPairs.get(finding.id) || [null, null];
  pair = pair.map(id => (live.includes(id) ? id : null));       // a Track deleted since is never offered
  const body = el('div');
  const render = () => {
    const [a, b] = pair;
    const current = choiceKey(choices.get(finding.id), a, b);
    const valid = a && b && a !== b;
    const nodes = [];
    if (live.length > 2) {
      const row = el('div', undefined, 'rc-filters');
      const pick = (label, index) => {
        const select = el('select');
        select.setAttribute('aria-label', label);
        const blank = el('option', 'Choose…');
        blank.value = '';
        select.append(blank);
        live.forEach(id => { const o = el('option', `#${id}`); o.value = String(id); select.append(o); });
        select.value = pair[index] ? String(pair[index]) : '';
        select.addEventListener('change', () => {
          pair = [...pair];
          pair[index] = Number(select.value) || null;
          manualPairs.set(finding.id, pair);
          setManualChoice(finding.id, null);         // a new pair starts with no decision
          render();
        });
        return select;
      };
      row.append(el('span', 'Pair to review:', 'rc-muted'), pick('Track A', 0), pick('Track B', 1));
      nodes.push(row);
      if (a && b && a === b) nodes.push(el('p', 'Choose two different Tracks.', 'rc-warn'));
    }
    if (valid) {
      const links = el('p', undefined, 'rc-muted');
      links.append(el('span', 'Listen and compare first: '));
      [a, b].forEach((id, i) => {
        const link = el('a', `Track ${i ? 'B' : 'A'} (#${id})`);
        link.href = `/track/${encodeURIComponent(id)}/`;
        link.target = '_blank';
        link.rel = 'noopener';
        links.append(link);
        if (!i) links.append(el('span', ' · '));
      });
      nodes.push(links);
      [['none', 'No action'], ['keep_a', `Keep Track A (#${a}), delete Track B (#${b})`],
       ['keep_b', `Keep Track B (#${b}), delete Track A (#${a})`], ['keep_both', 'Keep both (not a duplicate)']].forEach(([value, text]) => {
        const label = el('label', undefined, 'rc-choice');
        const input = el('input');
        input.type = 'radio';
        input.name = 'manual-' + finding.id;
        input.value = value;
        input.checked = value === current;
        input.addEventListener('change', () => {
          if (!input.checked) return;
          setManualChoice(finding.id, manualChoice(value, a, b, false));   // a new decision is not yet acknowledged
          render();
        });
        label.append(input, el('span', text));
        nodes.push(label);
      });
      const choice = choices.get(finding.id);
      if (choice && choice.action === 'delete' && current !== 'none') {
        nodes.push(el('p', m.warning, 'rc-manual-warning'));
        nodes.push(el('p', manualAudioText(m), 'rc-manual-warning'));
        const ackLabel = el('label', undefined, 'rc-choice');
        const ack = el('input');
        ack.type = 'checkbox';
        ack.name = 'manual-ack-' + finding.id;
        ack.checked = choice.ack === true;
        ack.addEventListener('change', () => {
          setManualChoice(finding.id, manualChoice(current, a, b, ack.checked));
          render();
        });
        ackLabel.append(ack, el('span', `I have reviewed both recordings and authorize deleting Track #${choice.discard} ` +
                                       'as my own editorial decision.'));
        nodes.push(ackLabel);
      } else {
        nodes.push(el('p', manualAudioText(m), 'rc-muted'));
      }
    }
    nodes.push(el('p', 'Nothing happens until you review the selection and confirm it.', 'rc-muted'));
    body.replaceChildren(...nodes);
  };
  render();
  box.append(body);
  return wrap;
}

function actionButton(text, onClick) {
  const b = el('button', text, 'rc-btn');
  b.type = 'button';
  b.addEventListener('click', onClick);
  return b;
}

function updateResolveBar() {
  const bar = document.getElementById('resolveBar');
  const list = selectionsPayload(choices);
  if (!list.length) { bar.replaceChildren(); bar.hidden = true; return; }
  const deletes = list.filter(s => s.action === 'delete').length;
  const manual = manualCounts(choices);
  const review = actionButton('Review selected…', reviewSelection);
  review.disabled = resolveBusy;
  bar.replaceChildren(el('span', `${list.length} pair(s) selected on this page: ${deletes} to delete, ` +
                                 `${list.length - deletes} to keep both.` +
                                 (manual.manual ? ` ${manual.manual} deletion(s) by manual editorial decision` +
                                  (manual.unacknowledged ? ` (${manual.unacknowledged} not yet acknowledged).` : '.') : '')), review,
                      actionButton('Clear selection', () => { choices.clear(); updateResolveBar(); loadFindings(); }));
  bar.hidden = false;
}

function showResolve(nodes) {
  const panel = document.getElementById('resolvePanel');
  panel.replaceChildren(...nodes);
  panel.hidden = false;
  panel.scrollIntoView({ block: 'nearest' });
}
function closeResolveButton(label) {
  return actionButton(label || 'Close', () => { resolveGen += 1; document.getElementById('resolvePanel').hidden = true; });
}

async function reviewSelection() {
  const selections = selectionsPayload(choices);
  if (!selections.length || resolveBusy) return;
  const gen = ++resolveGen;
  resolveBusy = true;
  updateResolveBar();
  showResolve([el('p', `Checking ${selections.length} pair(s) against the Library as it is now…`)]);
  let result;
  try {
    result = await postJSON('/api/tracks/reconciliation/duplicates/preview/', { scan_id: scanId, selections });
  } catch (e) {
    result = { resp: { ok: false, status: 0 }, data: {} };
  }
  resolveBusy = false;
  updateResolveBar();
  if (gen !== resolveGen) return;             // closed, or superseded by a newer review
  if (!result.resp.ok) {
    showResolve([el('p', 'Not previewed, nothing was changed: ' + (result.data.error || 'no answer from the server.'), 'rc-bad'),
                 closeResolveButton()]);
    return;
  }
  renderPreview(result.data);
}

function categoryText(t) {
  return [t.category && t.category.code, ...(t.additional_categories || []).map(c => c.code)].filter(Boolean).join(', ') || '—';
}
function referenceText(t) {
  const r = t.references || {};
  return `${r.playlist_count || 0} playlist, ${r.rotation_count || 0} rotation, ${r.upcoming_log_items || 0} entr` +
         `${r.upcoming_log_items === 1 ? 'y' : 'ies'} in ${r.upcoming_log_count || 0} current/upcoming log hour(s), ` +
         `${r.voicetracks || 0} voice track(s)`;
}
function logLinks(t) {
  const r = t.references || {};
  const p = el('p');
  if (!(r.upcoming_logs || []).length) return p;
  p.append(el('span', 'Scheduled in: '));
  r.upcoming_logs.forEach((log, i) => {
    const a = el('a', `${log.date} ${String(log.hour).padStart(2, '0')}:00 (${log.status}, ${log.items} entr${log.items === 1 ? 'y' : 'ies'})`);
    a.href = log.url;
    a.target = '_blank';
    a.rel = 'noopener';
    p.append(a);
    if (i < r.upcoming_logs.length - 1) p.append(el('span', ', '));
  });
  if (r.upcoming_log_count > r.upcoming_logs.length) p.append(el('span', ` and ${r.upcoming_log_count - r.upcoming_logs.length} more`));
  p.append(el('span', '. Each opens in a new tab: edit the log there, then use Re-check here.', 'rc-muted'));
  return p;
}

const STATUS_TEXT = { eligible: 'Can be deleted', needs_acknowledgment: 'Needs your acknowledgment', blocked: 'Blocked' };

function renderPreview(data) {
  const options = initialOptions(data);
  const nodes = [];
  const c = data.counts;
  nodes.push(el('p', `Review: ${c.eligible} can proceed, ${c.needs_acknowledgment} need your acknowledgment, ` +
                     `${c.blocked} blocked. Blocked pairs are left unchanged and stay selected.`));
  const confirmBox = el('input');
  confirmBox.type = 'checkbox';
  const confirmLabel = el('label', undefined, 'rc-choice');
  const applyBtn = actionButton('Apply', () => applySelection(data, options, confirmBox.checked));
  const summary = el('p', undefined, 'rc-muted');
  const manualIncluded = () => data.items.filter(i => i.authority === 'manual_editorial' && i.token &&
    (options.get(i.finding_id) || {}).include).length;
  const refresh = () => {
    const r = readiness(data, options);
    confirmLabel.replaceChildren(confirmBox, el('span', r.deletions
      ? `I understand that ${r.deletions} Track(s) will be permanently deleted from the Library database, with ` +
        'their files, waveforms and any acknowledged voice tracks. The kept Tracks are not changed except for the ' +
        'ticked categories.' + (manualIncluded() ? ` ${manualIncluded()} of them by my own editorial decision, not ` +
                                                   'verified as identical.' : '')
      : 'Confirm these decisions.'));
    applyBtn.textContent = r.deletions ? `Delete ${r.deletions} duplicate Track(s)` +
                                         (r.keeps ? ` and record ${r.keeps} keep-both` : '') : `Record ${r.keeps} keep-both`;
    summary.textContent = r.undecided ? `${r.undecided} pair(s) with voice tracks need a choice: Cancel or Delete anyway.` : '';
    applyBtn.disabled = !r.ready || !confirmBox.checked || resolveBusy;
  };
  confirmBox.addEventListener('change', refresh);
  data.items.forEach(item => nodes.push(previewItem(item, options, refresh)));
  if (data.applicable) {
    nodes.push(confirmLabel, summary);
    const row = el('div', undefined, 'rc-actions');
    row.append(applyBtn, actionButton('Re-check', reviewSelection), closeResolveButton('Cancel'));
    nodes.push(row);
    refresh();
  } else {
    const row = el('div', undefined, 'rc-actions');
    row.append(actionButton('Re-check', reviewSelection), closeResolveButton());
    nodes.push(el('p', 'Nothing in this selection can proceed now.', 'rc-warn'), row);
  }
  showResolve(nodes);
}

function previewItem(item, options, refresh) {
  const card = el('div', undefined, 'rc-card');
  const o = options.get(item.finding_id);
  const head = el('h3');
  head.append(el('span', STATUS_TEXT[item.status] || item.status, 'rc-badge'));
  if (item.action === 'keep_both') {
    head.append(el('span', `Keep both #${item.track_a} and #${item.track_b} (record: not duplicates)`));
    card.append(head);
  } else if (item.keep !== undefined) {
    head.append(el('span', `Keep #${item.keep}, delete #${item.discard}` +
                           (item.authority === 'manual_editorial' ? ' (manual editorial decision)' : '')));
    card.append(head);
  } else {
    head.append(el('span', `Finding ${item.finding_id}`));
    card.append(head);
  }
  if (item.evidence) card.append(el('p', evidenceText(item.evidence), 'rc-muted'));
  if (item.authority === 'manual_editorial' && item.manual) {
    card.append(el('p', item.manual.warning, 'rc-manual-warning'));
    card.append(el('p', manualAudioText(item.manual), 'rc-manual-warning'));
  }
  if (item.keep_track && item.discard_track) {
    card.append(trackTable([{ role: 'Keep', ...item.keep_track }, { role: 'Delete', ...item.discard_track }], [
      ['', t => t.role], ['Track', t => trackLink(t)], ['Title', t => t.title], ['Artist', t => t.artist],
      ['File', t => t.rel], ['Format', t => t.format], ['Size', t => fmtSize(t.size)], ['Categories', t => categoryText(t)],
      ['References', t => referenceText(t)],
    ]));
    card.append(logLinks(item.discard_track));
  }
  (item.reasons || []).forEach(r => card.append(el('p', r, 'rc-bad')));
  (item.warnings || []).forEach(w => card.append(el('p', w, 'rc-warn')));
  const legacy = item.legacy_decision;
  if (legacy && legacy.resolution && legacy.resolution !== 'unresolved') {
    card.append(el('p', `Recorded decision for this pair: ${legacy.resolution}${legacy.applied ? ' (applied)' : ''}.` +
      (item.action === 'delete' ? ' Deleting a Track removes its recorded decisions.' : ''), 'rc-muted'));
  }
  if (!o) return card;
  if (item.action === 'delete') {
    const suggested = item.suggested_categories || [];
    if (suggested.length) {
      card.append(el('p', `Add to #${item.keep} as additional categories (it keeps its primary category and all ` +
                          'current ones):'));
      suggested.forEach(cat => {
        const label = el('label', undefined, 'rc-choice');
        const box = el('input');
        box.type = 'checkbox';
        box.checked = o.categories.has(cat.id);
        box.addEventListener('change', () => { if (box.checked) o.categories.add(cat.id); else o.categories.delete(cat.id); refresh(); });
        label.append(box, el('span', `${cat.code} — ${cat.name}`));
        card.append(label);
      });
    } else {
      card.append(el('p', `#${item.keep} already has every category #${item.discard} has.`, 'rc-muted'));
    }
    if (item.status === 'needs_acknowledgment') {
      card.append(el('p', `Track #${item.discard} has ${item.voicetracks} voice track(s). Deleting it deletes them too; ` +
                          'they are not moved to the kept Track.', 'rc-warn'));
      const link = el('a', `Open Track #${item.discard}`);
      link.href = `/track/${encodeURIComponent(item.discard)}/`;
      link.target = '_blank';
      link.rel = 'noopener';
      card.append(link);
      [['cancel', 'Cancel this pair'], ['delete', `Delete anyway: I acknowledge that Track #${item.discard}'s ` +
        `${item.voicetracks} voice track(s) will be deleted`]].forEach(([value, text]) => {
        const label = el('label', undefined, 'rc-choice');
        const radio = el('input');
        radio.type = 'radio';
        radio.name = 'ack-' + item.finding_id;
        radio.checked = o.ack === value;
        radio.addEventListener('change', () => { if (radio.checked) { o.ack = value; o.include = value === 'delete'; refresh(); } });
        label.append(radio, el('span', text));
        card.append(label);
      });
      return card;
    }
  }
  const label = el('label', undefined, 'rc-choice');
  const include = el('input');
  include.type = 'checkbox';
  include.checked = o.include;
  include.addEventListener('change', () => { o.include = include.checked; refresh(); });
  label.append(include, el('span', 'Include this pair (untick to cancel it)'));
  card.append(label);
  return card;
}

const OUTCOME_TEXT = {
  deleted: 'Deleted', recorded: 'Recorded', already_decided: 'Already decided', cancelled: 'Cancelled',
  blocked: 'Blocked', stale: 'Changed since the preview', needs_acknowledgment: 'Not acknowledged',
  refused: 'Refused', failed: 'Failed', unknown: 'Unknown (no answer)', not_attempted: 'Not attempted',
};
const APPLY_URL = '/api/tracks/reconciliation/duplicates/apply/';

// One confirmation, then the pairs one request at a time, in order, with progress. A pair that is blocked, busy
// or refused is reported and the next one is sent; a lost answer stops the batch (an irreversible action is never
// retried or continued blindly) and the findings are reloaded from the server.
async function applySelection(preview, options, confirmed) {
  if (resolveBusy) return;
  const { send, cancelled } = applyQueue(preview, options);
  resolveGen += 1;
  resolveBusy = true;
  updateResolveBar();
  const results = [...cancelled];
  let processed = 0, unknown = false;
  for (let i = 0; i < send.length; i += 1) {
    const job = send[i];
    showResolve([el('p', `Applying one pair at a time: ${processed} of ${send.length} pair(s) processed…`)]);
    let result;
    try {
      result = await postJSON(APPLY_URL, { token: job.token, confirm: confirmed === true, choice: job.choice });
    } catch (e) {
      result = { resp: { ok: false, status: 0 }, data: {} };
    }
    const item = applyAnswer(job, result.resp, result.data);
    if (item === null) {
      unknown = true;
      results.push({ finding_id: job.finding_id, action: job.action, outcome: 'unknown',
                     message: (result.resp.status ? `Uncertain answer from the server (HTTP ${result.resp.status})`
                                                  : 'No answer from the server') +
                              ': whether this pair was applied is not known. It is not retried automatically.' });
      send.slice(i + 1).forEach(rest => results.push({ finding_id: rest.finding_id, action: rest.action,
        outcome: 'not_attempted', message: 'Not sent: processing stopped at the unanswered pair above.' }));
      break;
    }
    processed += 1;
    results.push(item);
  }
  resolveBusy = false;
  document.getElementById('navGuard').hidden = true;
  choices = choicesAfterApply(choices, results);
  renderResults({ scan_id: preview.scan_id, items: results, processed, total: send.length, unknown,
                  rescan_recommended: results.some(r => r.outcome === 'deleted') });
  updateResolveBar();
  loadFindings();                             // current Track and reference facts (the report itself is a snapshot)
}

function renderResults(data) {
  const nodes = [];
  const counts = Object.entries(outcomeCounts(data.items)).map(([k, n]) => `${OUTCOME_TEXT[k] || k}: ${n}`).join(' · ');
  const settled = data.items.every(r => SETTLED.has(r.outcome));
  nodes.push(el('p', `Processed ${data.processed} of ${data.total} pair(s). Result: ` + counts, settled ? 'rc-ok' : 'rc-warn'));
  if (data.unknown) {
    nodes.push(el('p', 'Stopped: the answer for one pair was lost or uncertain, so whether it was applied is not ' +
                       'known, and the pairs after it were not sent. The findings below have been reloaded from the server; use ' +
                       'Review selected… to see the current state before trying again.', 'rc-warn'));
  }
  data.items.forEach(r => {
    const card = el('div', undefined, 'rc-card');
    const head = el('h3');
    head.append(el('span', OUTCOME_TEXT[r.outcome] || r.outcome, 'rc-badge'));
    head.append(el('span', r.message || ''));
    card.append(head);
    if (r.outcome === 'deleted') {
      if (r.authority === 'manual_editorial') card.append(el('p', 'Deleted by your manual editorial decision (not verified as identical).', 'rc-muted'));
      if ((r.categories_added || []).length) card.append(el('p', `Added to #${r.keep}: ${r.categories_added.join(', ')}.`));
      if (r.voicetracks_deleted) card.append(el('p', `${r.voicetracks_deleted} voice track(s) were deleted with it.`, 'rc-warn'));
      const cleanup = r.cleanup || {};
      card.append(el('p', `File ${r.file || ''}: ${cleanup.message || 'outcome unknown.'}`,
                     cleanup.outcome === 'completed' ? 'rc-muted' : cleanup.outcome === 'failed' ? 'rc-bad' : 'rc-warn'));
    }
    (r.reasons || []).forEach(reason => card.append(el('p', reason, 'rc-bad')));
    nodes.push(card);
  });
  nodes.push(el('p', 'Deleting a Track removes its database record at once; each file’s removal is reported above ' +
                     'separately and is not guaranteed. Pairs that were not applied stay selected.', 'rc-muted'));
  if (data.rescan_recommended) {
    nodes.push(el('p', `The findings below are still from scan ${data.scan_id} (a snapshot); their Track details are ` +
                       'current. Run reconciliation (above) for a new scan when you have finished.', 'rc-warn'));
  }
  nodes.push(closeResolveButton());
  showResolve(nodes);
}

// ---- Category drift (3.11): the operator decides, per finding, whether the Category (A: move the file to its
// folder) or the folder (B: change the primary Category to the folder's) is right, or does nothing (C). Nothing is
// chosen by default. A preview rechecks everything on the server and returns one single-use token per repair; a
// confirmed batch (at most one findings page) is then sent one repair per request, in order, and stops on any
// answer that leaves the outcome unknown. After a batch the selection is cleared and the findings reloaded: an old
// selection is never applied to a changed report.
let driftChoices = new Map(), driftGen = 0, driftBusy = false, driftFilter = { folder: null, category: null, sort: false };
let driftGroups = null, driftVisible = [];

// drift:begin -- pure helpers (tested under Node).
function driftSelectionsPayload(map) {
  return [...map.entries()].map(([finding_id, c]) => ({ finding_id, direction: c.direction,
    ...(c.direction === 'set_category' ? { keep_old_primary: c.keepOld === true } : {}) }));
}
// The confirmed batch, in preview order: one apply request per included eligible repair, each with its own token.
function driftQueue(preview, include) {
  const send = [], cancelled = [];
  preview.items.forEach(item => {
    if (item.status !== 'eligible' || !item.token) return;
    if (include.get(item.finding_id) === false) {
      cancelled.push({ finding_id: item.finding_id, direction: item.direction, outcome: 'cancelled',
                       message: 'Cancelled: nothing was changed.' });
      return;
    }
    send.push({ finding_id: item.finding_id, direction: item.direction, token: item.token });
  });
  return { send, cancelled };
}
// One repair's answer: its result, a refusal (4xx: nothing was applied), or null when the answer was lost,
// unreadable or a 5xx -- whether it was applied is then unknown and the batch stops.
function driftAnswer(job, resp, data) {
  if (resp.ok) return data && data.item ? data.item : null;
  if (!resp.status || resp.status >= 500) return null;
  return { finding_id: job.finding_id, direction: job.direction, outcome: 'refused',
           message: 'Not applied: ' + ((data && data.error) || `HTTP ${resp.status}`) };
}
// An item the operator must look at before anything else happens (committed but its old file entry needs
// attention, or an unconfirmed commit) also stops the batch.
function driftStops(item) { return item === null || item.stop_batch === true; }
// drift:end

const DRIFT_TEXT = { move_file: 'Move file to primary Category', set_category: 'Change primary Category to match folder' };
const DRIFT_OUTCOME = {
  moved: 'Moved', updated: 'Category changed', unchanged: 'Already resolved', stale: 'Changed since the preview',
  refused: 'Refused', collision: 'Destination collision', busy: 'Busy', failed_before_commit: 'Failed (nothing changed)',
  committed_cleanup_required: 'Moved — old file entry needs attention', uncertain: 'Uncertain (check this Track)',
  cancelled: 'Cancelled', unknown: 'Unknown (no answer)', not_attempted: 'Not attempted',
};
const DRIFT_APPLY_URL = '/api/tracks/reconciliation/drift/apply/';

function catText(c) { return c ? `${c.code}${c.name ? ' — ' + c.name : ''}${c.kind ? ' (' + c.kind + ')' : ''}` : '—'; }

function renderDrift(card, f) {
  const r = f.drift_review || {};
  const d = f.drift || {};
  card.append(trackTable([{}], [
    ['Primary Category', () => catText(r.category)], ['Current folder', () => (r.folder === null || r.folder === undefined)
      ? '—' : (r.folder || '(Library root)')],
    ['Folder’s Category', () => (r.set_category || {}).category ? catText(r.set_category.category) : 'none'],
    ['Move destination', () => (r.move || {}).destination || '—'],
  ]));
  if (d.rel) card.append(el('p', 'Current file: ' + d.rel, 'rc-code'));
  if (!r.evidence) { card.append(el('p', 'Review only: ' + (r.reason || 'no repair evidence') + '.', 'rc-warn')); return; }
  const box = el('fieldset', undefined, 'rc-resolve');
  box.append(el('legend', 'Resolve'));
  const current = driftChoices.get(f.id);
  const keep = el('input');
  keep.type = 'checkbox';
  keep.checked = !!(current && current.keepOld);
  keep.disabled = !(current && current.direction === 'set_category');
  const options = [
    ['move_file', `A — Move file to ${(r.category || {}).code || 'its Category'} folder` +
      ((r.move || {}).destination ? ` (${r.move.destination})` : ''), r.move || {}],
    ['set_category', `B — Change primary Category to ${((r.set_category || {}).category || {}).code || r.folder || '—'}`,
     r.set_category || {}],
    ['', 'C — No action / defer', { available: true }],
  ];
  options.forEach(([value, text, opt]) => {
    const label = el('label', undefined, 'rc-choice');
    const radio = el('input');
    radio.type = 'radio';
    radio.name = 'drift-' + f.id;
    radio.value = value;
    radio.disabled = !opt.available || driftBusy;
    radio.checked = value ? !!(current && current.direction === value) : !current;
    radio.addEventListener('change', () => {
      if (!radio.checked) return;
      if (value) driftChoices.set(f.id, { direction: value, keepOld: value === 'set_category' && keep.checked });
      else driftChoices.delete(f.id);
      keep.disabled = value !== 'set_category';
      updateDriftBar();
    });
    label.append(radio, el('span', text + (opt.available ? '' : ` — unavailable: ${opt.reason || 'not offered'}`)));
    box.append(label);
  });
  const keepLabel = el('label', undefined, 'rc-choice');
  keep.addEventListener('change', () => {
    const c = driftChoices.get(f.id);
    if (c && c.direction === 'set_category') { c.keepOld = keep.checked; updateDriftBar(); }
  });
  keepLabel.append(keep, el('span', `With B: also keep ${(r.category || {}).code || 'the old primary Category'} as an additional Category`));
  box.append(keepLabel);
  box.append(el('p', 'A changes the path future playback opens (the Categories stay the same; the waveform shows as ' +
                     'unverified until Reanalyze Track). B changes what the scheduler may select this Track for (the ' +
                     'file stays where it is). Tracks on air or in the current or next hour are refused until later.', 'rc-muted'));
  card.append(box);
}

function renderDriftTools(groups) {
  const tools = document.getElementById('driftTools');
  if (groups) driftGroups = groups;
  if (document.getElementById('typeFilter').value !== 'category_drift' || !driftGroups) {
    tools.hidden = true;
    tools.replaceChildren();
    return;
  }
  const folders = [...new Set(driftGroups.map(g => g.folder))].sort();
  const cats = [...new Set(driftGroups.map(g => g.category))].sort();
  const select = (label, values, current, apply) => {
    const s = el('select');
    s.setAttribute('aria-label', label);
    const any = el('option', label + ': any');
    any.value = '\u0000any';
    s.append(any);
    values.forEach(v => { const o = el('option', v || '(Library root)'); o.value = v; s.append(o); });
    s.value = current === null ? '\u0000any' : current;
    s.addEventListener('change', () => navigate(() => { page = 1; apply(s.value === '\u0000any' ? null : s.value); }));
    return s;
  };
  const sortBox = el('input');
  sortBox.type = 'checkbox';
  sortBox.checked = driftFilter.sort;
  sortBox.addEventListener('change', () => navigate(() => { page = 1; driftFilter.sort = sortBox.checked; }));
  const sortLabel = el('label');
  sortLabel.append(sortBox, el('span', ' Group by folder → Category'));
  const row = [el('span', 'Drift:', 'rc-muted'),
    select('Current folder', folders, driftFilter.folder, v => { driftFilter.folder = v; }),
    select('Primary Category', cats, driftFilter.category, v => { driftFilter.category = v; }), sortLabel,
    actionButton('Select visible: move files', () => selectVisibleDrift('move_file')),
    actionButton('Select visible: change Category', () => selectVisibleDrift('set_category')),
    actionButton('Clear drift selection', () => { driftChoices.clear(); updateDriftBar(); loadFindings(); })];
  driftGroups.slice(0, 12).forEach(g => {
    const chip = el('button', `${g.folder || '(root)'} → ${g.category} (${g.count})`, 'rc-chip');
    chip.type = 'button';
    chip.setAttribute('aria-pressed', String(driftFilter.folder === g.folder && driftFilter.category === g.category));
    chip.addEventListener('click', () => navigate(() => { page = 1; driftFilter.folder = g.folder; driftFilter.category = g.category; }));
    row.push(chip);
  });
  tools.replaceChildren(...row);
  tools.hidden = false;
}

// One explicitly chosen direction for every visible finding that offers it (at most one page: 25 findings).
function selectVisibleDrift(direction) {
  if (driftBusy) return;
  driftVisible.forEach(f => {
    const r = f.drift_review || {};
    if (((direction === 'move_file' ? r.move : r.set_category) || {}).available) driftChoices.set(f.id, { direction, keepOld: false });
  });
  updateDriftBar();
  loadFindings();
}

function updateDriftBar() {
  const bar = document.getElementById('driftBar');
  const list = driftSelectionsPayload(driftChoices);
  if (!list.length) { bar.replaceChildren(); bar.hidden = true; return; }
  const moves = list.filter(s => s.direction === 'move_file').length;
  const review = actionButton('Review category drift…', reviewDrift);
  review.disabled = driftBusy;
  bar.replaceChildren(el('span', `${list.length} category-drift finding(s) selected: ${moves} to move a file, ` +
                                 `${list.length - moves} to change the primary Category.`), review,
                      actionButton('Clear', () => { driftChoices.clear(); updateDriftBar(); loadFindings(); }));
  bar.hidden = false;
}

function showDrift(nodes) {
  const panel = document.getElementById('driftPanel');
  panel.replaceChildren(...nodes);
  panel.hidden = false;
  panel.scrollIntoView({ block: 'nearest' });
}
function closeDriftButton(label) {
  return actionButton(label || 'Close', () => { driftGen += 1; document.getElementById('driftPanel').hidden = true; });
}

async function reviewDrift() {
  const selections = driftSelectionsPayload(driftChoices);
  if (!selections.length || driftBusy) return;
  const gen = ++driftGen;
  driftBusy = true;
  updateDriftBar();
  showDrift([el('p', `Checking ${selections.length} finding(s) against the Library as it is now…`)]);
  let result;
  try {
    result = await postJSON('/api/tracks/reconciliation/drift/preview/', { scan_id: scanId, selections });
  } catch (e) {
    result = { resp: { ok: false, status: 0 }, data: {} };
  }
  driftBusy = false;
  updateDriftBar();
  if (gen !== driftGen) return;
  if (!result.resp.ok) {
    showDrift([el('p', 'Not previewed, nothing was changed: ' + (result.data.error || 'no answer from the server.'), 'rc-bad'),
               closeDriftButton()]);
    return;
  }
  renderDriftPreview(result.data);
}

const DRIFT_STATUS = { eligible: 'Can be applied', blocked: 'Blocked', already_resolved: 'Already resolved' };

function renderDriftPreview(data) {
  const c = data.counts;
  const include = new Map();
  const nodes = [el('p', `Selected ${c.selected}: ${c.eligible} eligible, ${c.refused} refused, ${c.already_resolved} ` +
    `already resolved. Expected: ${c.expected_moves} file move(s), ${c.expected_category_changes} Category change(s). ` +
    `${c.destination_collisions} destination collision(s), ${c.scheduling_conflicts} scheduling conflict(s), ` +
    `${c.files_requiring_review} file(s) requiring review.`)];
  data.items.forEach(item => {
    const card = el('div', undefined, 'rc-card');
    const head = el('h3');
    head.append(el('span', DRIFT_STATUS[item.status] || item.status, 'rc-badge'));
    head.append(el('span', `${DRIFT_TEXT[item.direction] || item.direction} — finding ${item.finding_id}`));
    card.append(head);
    const t = item.track;
    if (t) {
      card.append(trackTable([t], [['Track', x => trackLink(x)], ['Title', x => x.title], ['Artist', x => x.artist],
        ['File', x => x.rel]]));
      if (item.direction === 'move_file' && item.destination) {
        card.append(el('p', `Moves to ${item.destination}. Primary Category stays ${catText(item.category_from)}; ` +
                            'additional Categories are unchanged.'));
      } else if (item.direction === 'set_category' && item.category_to) {
        card.append(el('p', `Primary Category: ${catText(item.category_from)} → ${catText(item.category_to)}. The file stays where it is.`));
        (item.additional_add || []).forEach(a => card.append(el('p', `Adds ${a.code} as an additional Category (your choice).`)));
      }
    }
    (item.reasons || []).forEach(r => card.append(el('p', r, 'rc-bad')));
    (item.warnings || []).forEach(w => card.append(el('p', w, 'rc-warn')));
    if (item.status === 'eligible') {
      const label = el('label', undefined, 'rc-choice');
      const box = el('input');
      box.type = 'checkbox';
      box.checked = true;
      box.addEventListener('change', () => { include.set(item.finding_id, box.checked); refresh(); });
      label.append(box, el('span', 'Include this repair (untick to cancel it)'));
      card.append(label);
    }
    nodes.push(card);
  });
  const confirmBox = el('input');
  confirmBox.type = 'checkbox';
  const applyBtn = actionButton('Apply', () => applyDrift(data, include, confirmBox.checked));
  const confirmLabel = el('label', undefined, 'rc-choice');
  const refresh = () => {
    const n = driftQueue(data, include).send.length;
    confirmLabel.replaceChildren(confirmBox, el('span', `I have reviewed these ${n} repair(s): files are moved or primary ` +
      'Categories changed exactly as shown above, one Track at a time.'));
    applyBtn.textContent = `Apply ${n} repair(s)`;
    applyBtn.disabled = !n || !confirmBox.checked || driftBusy;
  };
  confirmBox.addEventListener('change', refresh);
  const row = el('div', undefined, 'rc-actions');
  if (c.eligible) {
    row.append(applyBtn, actionButton('Re-check', reviewDrift), closeDriftButton('Cancel'));
    nodes.push(confirmLabel, row);
    refresh();
  } else {
    row.append(actionButton('Re-check', reviewDrift), closeDriftButton());
    nodes.push(el('p', 'Nothing in this selection can be applied now.', 'rc-warn'), row);
  }
  showDrift(nodes);
}

async function applyDrift(preview, include, confirmed) {
  if (driftBusy) return;
  const { send, cancelled } = driftQueue(preview, include);
  driftGen += 1;
  driftBusy = true;
  updateDriftBar();
  const results = [...cancelled];
  let processed = 0, stopped = '';
  for (let i = 0; i < send.length; i += 1) {
    const job = send[i];
    showDrift([el('p', `Applying one repair at a time: ${processed} of ${send.length} processed…`)]);
    let result;
    try {
      result = await postJSON(DRIFT_APPLY_URL, { token: job.token, confirm: confirmed === true });
    } catch (e) {
      result = { resp: { ok: false, status: 0 }, data: {} };
    }
    const item = driftAnswer(job, result.resp, result.data);
    if (item === null) {
      stopped = 'unknown';
      results.push({ finding_id: job.finding_id, direction: job.direction, outcome: 'unknown',
                     message: (result.resp.status ? `Uncertain answer from the server (HTTP ${result.resp.status})`
                                                  : 'No answer from the server') +
                              ': whether this repair was applied is not known. It is not retried automatically.' });
    } else {
      processed += 1;
      results.push(item);
      if (driftStops(item)) stopped = 'attention';
    }
    if (stopped) {
