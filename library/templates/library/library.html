{% extends "base.html" %}

{% block title %}Library — IsadoraAir{% endblock %}

{% block extra_css %}
<style>
  .lib-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: center;
    margin-bottom: 0.5rem;
  }

  .lib-search {
    flex: 1;
    min-width: 220px;
    max-width: 400px;
    background: var(--bg-dark);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 0.5rem 0.8rem;
    color: var(--text-main);
    font-size: 0.875rem;
  }
  .lib-search:focus { outline: none; border-color: var(--accent); }
  .lib-search::placeholder { color: var(--text-muted); }

  .lib-select {
    background: var(--bg-dark);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 0.45rem 0.6rem;
    color: var(--text-main);
    font-size: 0.8rem;
    cursor: pointer;
  }
  .lib-select:focus { outline: none; border-color: var(--accent); }

  .lib-stats {
    color: var(--text-muted);
    font-size: 0.8rem;
    margin-left: auto;
  }

  .lib-import-btn {
    background: var(--bg-dark);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    color: var(--text-main);
    padding: 0.45rem 0.75rem;
    font-size: 0.8rem;
    text-decoration: none;
    white-space: nowrap;
    transition: border-color 0.12s, color 0.12s;
  }
  .lib-import-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* --- Bulk action bar --- */
  .bulk-bar {
    display: none;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 0.8rem;
    margin-bottom: 0.5rem;
    background: rgba(34, 197, 94, 0.08);
    border: 1px solid rgba(34, 197, 94, 0.25);
    border-radius: 8px;
    font-size: 0.8rem;
  }
  .bulk-bar.visible { display: flex; }

  .bulk-bar .bulk-count {
    color: var(--accent);
    font-weight: 600;
  }

  .bulk-btn {
    background: var(--bg-dark);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    color: var(--text-main);
    padding: 0.3rem 0.65rem;
    font-size: 0.78rem;
    cursor: pointer;
    transition: border-color 0.12s;
  }
  .bulk-btn:hover { border-color: var(--accent); }
  .bulk-btn.danger { color: var(--danger); border-color: rgba(249, 115, 115, 0.4); }
  .bulk-btn.danger:hover { border-color: var(--danger); background: rgba(249, 115, 115, 0.08); }

  /* --- Table --- */
  .lib-table-wrap {
    overflow-x: auto;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
  }

  table.lib-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.825rem;
  }

  table.lib-table th {
    background: var(--bg-dark);
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 0.55rem 0.7rem;
    text-align: left;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    border-bottom: 1px solid var(--border-subtle);
    transition: color 0.12s;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  table.lib-table th:hover { color: var(--text-main); }
  table.lib-table th.sorted { color: var(--accent); }
  table.lib-table th .arrow { font-size: 0.65rem; margin-left: 3px; }
  table.lib-table th.col-check { cursor: default; width: 32px; }

  table.lib-table td {
    padding: 0.45rem 0.7rem;
    border-bottom: 1px solid rgba(148, 163, 184, 0.08);
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 300px;
  }

  table.lib-table tr { cursor: pointer; }
  table.lib-table tr:hover td {
    background: rgba(148, 163, 184, 0.06);
  }
  table.lib-table tr.selected td {
    background: rgba(34, 197, 94, 0.08);
  }

  td.col-duration, td.col-format, td.col-ready {
    text-align: center;
    color: var(--text-muted);
  }

  td.col-category {
    color: var(--text-muted);
    font-size: 0.75rem;
  }

  td.col-check { text-align: center; }

  .ready-yes { color: var(--accent); }
  .ready-no  { color: var(--text-muted); opacity: 0.5; }

  input[type="checkbox"] {
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* --- Pagination --- */
  .lib-pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    margin-top: 1rem;
  }

  .lib-pager button {
    background: var(--bg-dark);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    color: var(--text-main);
    padding: 0.35rem 0.8rem;
    font-size: 0.8rem;
    cursor: pointer;
    transition: border-color 0.12s;
  }
  .lib-pager button:hover { border-color: var(--accent); }
  .lib-pager button:disabled { opacity: 0.3; cursor: default; border-color: var(--border-subtle); }

  .lib-pager .page-info {
    color: var(--text-muted);
    font-size: 0.8rem;
  }

  .lib-empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
</style>
{% endblock %}

{% block content %}
<div class="lib-toolbar">
  <input type="text" class="lib-search" id="searchInput"
         placeholder="Search title, artist, album...">

  <select class="lib-select" id="categoryFilter">
    <option value="">All categories</option>
    {% for cat in categories %}
    <option value="{{ cat.id }}">{{ cat.name }}</option>
    {% endfor %}
  </select>

  <select class="lib-select" id="readyFilter">
    <option value="">All status</option>
    <option value="true">Ready to air</option>
    <option value="false">Not ready</option>
  </select>

  <a href="{% url 'library:library-import' %}" class="lib-import-btn">+ Import Tracks</a>

  <span class="lib-stats" id="stats"></span>
</div>

<div class="bulk-bar" id="bulkBar">
  <span class="bulk-count" id="bulkCount">0</span> selected
  <button class="bulk-btn" onclick="bulkAction('ready2air_on')">Mark Ready</button>
  <button class="bulk-btn" onclick="bulkAction('ready2air_off')">Mark Not Ready</button>
  <select class="lib-select" id="bulkCategorySelect" style="font-size:0.78rem;">
    <option value="">Set category...</option>
    {% for cat in categories %}
    <option value="{{ cat.id }}">{{ cat.name }}</option>
    {% endfor %}
  </select>
  <select class="lib-select" id="bulkAdditionalCategorySelect" style="font-size:0.78rem;">
    <option value="">Set additional category...</option>
    {% for cat in categories %}
    <option value="{{ cat.id }}">{{ cat.name }}</option>
    {% endfor %}
  </select>
  <select class="lib-select" id="bulkHolidaySelect" style="font-size:0.78rem;">
    <option value="">Add holiday...</option>
    {% for h in holidays %}
    <option value="{{ h.code }}">{{ h.name }}</option>
    {% endfor %}
  </select>
  <button class="bulk-btn" onclick="bulkApply()">Apply</button>
  <button class="bulk-btn danger" onclick="bulkDelete()">Delete</button>
  <button class="bulk-btn" onclick="clearSelection()" style="margin-left:auto;">Clear</button>
</div>

<div class="lib-table-wrap">
  <table class="lib-table">
    <thead>
      <tr>
        <th class="col-check"><input type="checkbox" id="selectAll" title="Select all on page"></th>
        <th data-sort="title">Title <span class="arrow"></span></th>
        <th data-sort="artist">Artist <span class="arrow"></span></th>
        <th data-sort="album">Album <span class="arrow"></span></th>
        <th data-sort="category">Category <span class="arrow"></span></th>
        <th data-sort="duration">Duration <span class="arrow"></span></th>
        <th data-sort="format">Fmt <span class="arrow"></span></th>
        <th data-sort="ready2air">R2A <span class="arrow"></span></th>
      </tr>
    </thead>
    <tbody id="trackBody"></tbody>
  </table>
</div>

<div class="lib-pager">
  <button id="prev10Btn" onclick="goPage(-10)">&laquo; 10</button>
  <button id="prevBtn" onclick="goPage(-1)">&lsaquo; Prev</button>
  <span class="page-info" id="pageInfo"></span>
  <button id="nextBtn" onclick="goPage(1)">Next &rsaquo;</button>
  <button id="next10Btn" onclick="goPage(10)">10 &raquo;</button>
</div>

<div class="lib-empty" id="emptyMsg" style="display:none;">No tracks found.</div>
{% endblock %}

{% block extra_js %}
<script>
let currentSort = 'title';
let currentDir = 'asc';
let currentPage = 1;
let totalPages = 1;
let debounceTimer = null;
let selectedIds = new Set();
let pageTrackIds = [];

function getCookie(name) {
  let val = null;
  document.cookie.split(';').forEach(c => {
    c = c.trim();
    if (c.startsWith(name + '='))
      val = decodeURIComponent(c.substring(name.length + 1));
  });
  return val;
}

function fmtDuration(sec) {
  if (!sec && sec !== 0) return '';
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function buildQuery() {
  const params = new URLSearchParams();
  const q = document.getElementById('searchInput').value.trim();
  if (q) params.set('q', q);
  const cat = document.getElementById('categoryFilter').value;
  if (cat) params.set('category', cat);
  const ready = document.getElementById('readyFilter').value;
  if (ready) params.set('ready2air', ready);
  params.set('sort', currentSort);
  params.set('dir', currentDir);
  params.set('page', currentPage);
  params.set('per_page', 50);
  return params.toString();
}

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  const count = document.getElementById('bulkCount');
  if (selectedIds.size > 0) {
    bar.classList.add('visible');
    count.textContent = selectedIds.size;
  } else {
    bar.classList.remove('visible');
  }
  document.getElementById('selectAll').checked =
    pageTrackIds.length > 0 && pageTrackIds.every(id => selectedIds.has(id));
}

function toggleSelect(id, checkbox) {
  if (selectedIds.has(id)) {
    selectedIds.delete(id);
  } else {
    selectedIds.add(id);
  }
  const row = checkbox.closest('tr');
  row.classList.toggle('selected', selectedIds.has(id));
  updateBulkBar();
}

function clearSelection() {
  selectedIds.clear();
  document.querySelectorAll('#trackBody tr').forEach(tr => {
    tr.classList.remove('selected');
    const cb = tr.querySelector('input[type="checkbox"]');
    if (cb) cb.checked = false;
  });
  updateBulkBar();
}

async function bulkAction(action) {
  if (selectedIds.size === 0) return;
  const resp = await fetch('/api/tracks/bulk/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken'),
    },
    body: JSON.stringify({ action, ids: [...selectedIds] }),
  });
  if (resp.ok) {
    clearSelection();
    loadTracks();
  }
}

async function bulkDelete() {
  const n = selectedIds.size;
  if (n === 0) return;
  // Sample the titles we're about to delete so the operator can spot a
  // misclick before it's irreversible. Cap at 5 for readability.
  const rows = [...document.querySelectorAll('#trackBody tr')];
  const titles = [];
  for (const tr of rows) {
    const id = parseInt(tr.dataset.id);
    if (selectedIds.has(id)) {
      // Title cell is the second <td> (index 1: after col-check).
      const t = tr.cells[1];
      titles.push(t ? t.textContent.trim() : `id ${id}`);
      if (titles.length >= 5) break;
    }
  }
  const preview = titles.join('\n  • ');
  const more = n > titles.length ? `\n  … and ${n - titles.length} more` : '';
  const msg =
    `Delete ${n} track${n === 1 ? '' : 's'} permanently?\n\n` +
    `This removes the DB row AND the audio file from disk. Cannot be undone.\n\n` +
    `  • ${preview}${more}`;
  if (!confirm(msg)) return;

  const resp = await fetch('/api/tracks/bulk/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken'),
    },
    body: JSON.stringify({ action: 'delete', ids: [...selectedIds] }),
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    alert('Delete failed: ' + (data.error || resp.status));
    return;
  }
  if (data.blocked && data.blocked.length) {
    const lines = data.blocked.map(b =>
      `  • ${b.artist ? b.artist + ' — ' : ''}${b.title}: ${b.reason}`
    ).join('\n');
    alert(
      `Deleted ${data.deleted} track${data.deleted === 1 ? '' : 's'}.\n\n` +
      `${data.blocked.length} could not be deleted:\n${lines}`
    );
  }
  clearSelection();
  loadTracks();
}

async function bulkApply() {
  // Combined dispatcher for all three dropdowns in the bulk bar. Any
  // combination of primary category / additional category / holiday
  // can be applied together (one API call per action). If none picked,
  // nothing happens rather than firing an empty request.
  const catSelect = document.getElementById('bulkCategorySelect');
  const addCatSelect = document.getElementById('bulkAdditionalCategorySelect');
  const holSelect = document.getElementById('bulkHolidaySelect');
  const catId = catSelect.value;
  const addCatId = addCatSelect.value;
  const holCode = holSelect.value;
  if (selectedIds.size === 0) return;
  if (!catId && !addCatId && !holCode) return;

  const ids = [...selectedIds];
  const headers = {
    'Content-Type': 'application/json',
    'X-CSRFToken': getCookie('csrftoken'),
  };

  if (catId) {
    const resp = await fetch('/api/tracks/bulk/', {
      method: 'POST', headers,
      body: JSON.stringify({ action: 'set_category', ids, category_id: parseInt(catId) }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      alert('Set category failed: ' + (err.error || resp.status));
      return;
    }
    catSelect.value = '';
  }

  if (addCatId) {
    const resp = await fetch('/api/tracks/bulk/', {
      method: 'POST', headers,
      body: JSON.stringify({ action: 'add_additional_category', ids, category_id: parseInt(addCatId) }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      alert('Set additional category failed: ' + (err.error || resp.status));
      return;
    }
    addCatSelect.value = '';
  }

  if (holCode) {
    const resp = await fetch('/api/tracks/bulk/', {
      method: 'POST', headers,
      body: JSON.stringify({ action: 'add_holiday', ids, holiday_code: holCode }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      alert('Add holiday failed: ' + (err.error || resp.status));
      return;
    }
    holSelect.value = '';
  }

  clearSelection();
  loadTracks();
}

async function loadTracks() {
  const resp = await fetch('/api/tracks/?' + buildQuery());
  if (!resp.ok) return;
  const data = await resp.json();

  totalPages = data.pages;
  currentPage = data.page;
  pageTrackIds = data.items.map(t => t.id);

  const stats = document.getElementById('stats');
  stats.textContent = data.total.toLocaleString() + ' tracks';

  const body = document.getElementById('trackBody');
  const empty = document.getElementById('emptyMsg');

  if (data.items.length === 0) {
    body.innerHTML = '';
    empty.style.display = '';
  } else {
    empty.style.display = 'none';
    body.innerHTML = data.items.map(t => {
      const checked = selectedIds.has(t.id) ? 'checked' : '';
      const sel = selectedIds.has(t.id) ? 'selected' : '';
      return `<tr class="${sel}" data-id="${t.id}">
        <td class="col-check" onclick="event.stopPropagation()">
          <input type="checkbox" ${checked}
                 onchange="toggleSelect(${t.id}, this)">
        </td>
        <td>${esc(t.title)}</td>
        <td>${esc(t.artist)}</td>
        <td>${esc(t.album)}</td>
        <td class="col-category">${esc(t.category_code)}</td>
        <td class="col-duration">${fmtDuration(t.duration_seconds)}</td>
        <td class="col-format">${esc(t.format)}</td>
        <td class="col-ready">${t.ready2air
          ? '<span class="ready-yes">&#10003;</span>'
          : '<span class="ready-no">&mdash;</span>'}</td>
      </tr>`;
    }).join('');

    // Row click navigates to detail (unless clicking checkbox)
    body.querySelectorAll('tr').forEach(tr => {
      tr.addEventListener('click', () => {
        window.location.href = '/track/' + tr.dataset.id + '/';
      });
    });
  }

  // Update sort indicators
  document.querySelectorAll('th[data-sort]').forEach(th => {
    const arrow = th.querySelector('.arrow');
    if (th.dataset.sort === currentSort) {
      th.classList.add('sorted');
      arrow.textContent = currentDir === 'asc' ? '▲' : '▼';
    } else {
      th.classList.remove('sorted');
      arrow.textContent = '';
    }
  });

  // Update pager
  document.getElementById('pageInfo').textContent =
    `Page ${currentPage} of ${totalPages}`;
  document.getElementById('prev10Btn').disabled = currentPage <= 10;
  document.getElementById('prevBtn').disabled = currentPage <= 1;
  document.getElementById('nextBtn').disabled = currentPage >= totalPages;
  document.getElementById('next10Btn').disabled = currentPage + 10 > totalPages;

  updateBulkBar();
}

function goPage(delta) {
  currentPage = Math.max(1, Math.min(totalPages, currentPage + delta));
  loadTracks();
}

// Select all checkbox
document.getElementById('selectAll').addEventListener('change', function() {
  if (this.checked) {
    pageTrackIds.forEach(id => selectedIds.add(id));
  } else {
    pageTrackIds.forEach(id => selectedIds.delete(id));
  }
  document.querySelectorAll('#trackBody tr').forEach(tr => {
    const id = parseInt(tr.dataset.id);
    const cb = tr.querySelector('input[type="checkbox"]');
    if (cb) cb.checked = selectedIds.has(id);
    tr.classList.toggle('selected', selectedIds.has(id));
  });
  updateBulkBar();
});

// Sort on header click
document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const field = th.dataset.sort;
    if (currentSort === field) {
      currentDir = currentDir === 'asc' ? 'desc' : 'asc';
    } else {
      currentSort = field;
      currentDir = 'asc';
    }
    currentPage = 1;
    loadTracks();
  });
});

// Search with debounce
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    currentPage = 1;
    loadTracks();
  }, 300);
});

// Filter changes
document.getElementById('categoryFilter').addEventListener('change', () => {
  currentPage = 1;
  loadTracks();
});
document.getElementById('readyFilter').addEventListener('change', () => {
  currentPage = 1;
  loadTracks();
});

// Initial load
loadTracks();
</script>
{% endblock %}
