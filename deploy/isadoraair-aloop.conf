# snd-aloop module options -- three loopback card instances at fixed
# indices 0, 3, 4 (NOT the kernel's default single auto-numbered
# instance). Install to /etc/modprobe.d/isadoraair-aloop.conf.
#
# Why three, and why pinned indices:
#   - Card 0 ("Loopback"): engine.py's master pre-StereoTool mix out
#     (device 0) -- StereoTool's own "Stereotool Input" AudioOutput
#     reads plughw:0,0.
#   - Card 3 ("Loopback_1"): StereoTool's processed output back in,
#     device 1 subdevice 0 specifically -- /etc/asound.conf's
#     airtap/airtap_ds aliases hardcode hw:Loopback_1,1,0 (dsnoop lets
#     encoders + aircheck share that one capture stream). See
#     deploy/asound.conf's own header comment for the full dsnoop/plug
#     rationale.
#   - Card 4 ("Loopback_2"): reserved/available for a second processing
#     bridge if ever needed; not currently consumed by any IsadoraAir
#     code path.
#
# Real cards (onboard HDA, USB DACs, etc.) auto-enumerate around
# whatever indices are still free, in kernel probe order -- pinning the
# loopback indices explicitly is what keeps hw:Loopback_1,1,0 stable
# across reboots regardless of what other audio hardware is plugged in
# or in what order it's detected. Without this file, `modprobe
# snd-aloop` creates exactly one loopback card at an auto-assigned
# index, which will NOT match what /etc/asound.conf expects.
#
# Also requires /etc/modules-load.d/snd-aloop.conf (containing the
# single line `snd-aloop`) so the module loads at boot at all -- this
# file only supplies its options once it does.
options snd-aloop enable=1,1,1 index=0,3,4
