pcm.!default {
    type hw
    card 2
    device 0
}

ctl.!default {
    type hw
    card 2
    device 0
}

# ---------------------------------------------------------------
# Aircheck tap: dsnoop alias on the post-StereoTool loopback so
# encoders (liquidsoap) and aircheck (ffmpeg) can share ONE capture
# stream of Loopback_1 subdevice 0.
#
# snd_aloop pairs playback sub-N with capture sub-N one-to-one, and
# StereoTool writes only to playback sub-0 -- so a second reader
# opening plughw:Loopback_1,1 (no subdev) lands on sub-1..7 and
# gets silence. dsnoop locks sub-0 and shares the capture stream
# via POSIX shm.
#
# The plug wrapper is required for ffmpeg -- ffmpeg's ALSA input
# negotiates a sample format that dsnoop-alone rejects with
# "cannot set sample format" (Invalid argument). plug handles the
# format negotiation transparently.
#
# Period/buffer chosen empirically to avoid liquidsoap overruns:
# 441/4410 caused ~2 overruns/sec, 2048/16384 gave ~1 per 7s.
# 8192/65536 (~186ms period, 1.5s buffer) held for a while but
# 320 mp3 encoder started skipping 2026-07-20 -- doubled to
# 16384/131072 (~372ms period, ~3s buffer). No audible latency
# cost (encoders/aircheck already have huge downstream latency);
# only a bit more kernel RAM for the ring.
pcm.airtap {
    type plug
    slave.pcm "airtap_ds"
}

pcm.airtap_ds {
    type dsnoop
    ipc_key 4711
    slave {
        pcm "hw:Loopback_1,1,0"
        rate 44100
        channels 2
        format S16_LE
        period_size 16384
        buffer_size 131072
    }
}
