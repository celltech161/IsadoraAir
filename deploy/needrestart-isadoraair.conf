# /etc/needrestart/conf.d/isadoraair.conf
# Install to: /etc/needrestart/conf.d/isadoraair.conf
#
# Never let needrestart auto-restart audio-path services. Ordering
# matters -- stereotool must open its ALSA outputs (both the FM DAC
# on card 1 AND the Loopback_1 for encoders on card 3) BEFORE
# liquidsoap opens the loopback capture side, or the loopback params
# negotiation fails and StereoTool's second output stays wedged in
# OPEN state. Ubuntu's default needrestart -m u (unattended) doesn't
# know that; when apt-daily-upgrade upgrades any library these
# services map (libsqlite3, libssl, libfreetype6, ...), it restarts
# them all in whatever order it picks.
#
# Live-caught 2026-07-22 06:19: libsqlite3-0 + kernel + nginx +
# libfreetype6 + libxfont2 + openssh upgraded, needrestart flagged
# stereotool + engine + encoders, mass-restarted them, and the
# encoder feed went silent for 1h37m until manual recovery.
#
# Trade-off: these services will not auto-restart to pick up library
# security fixes. Any such upgrade takes effect on the next manually-
# scheduled restart. For a broadcast box that's the right trade --
# random-order mass restarts of the audio chain are worse than a
# 24-hour lag on picking up a lib bump.

$nrconf{override_rc}->{qr(^isadoraair-engine\.service$)} = 0;
$nrconf{override_rc}->{qr(^isadoraair-encoders\.service$)} = 0;
$nrconf{override_rc}->{qr(^isadoraair-rbds\.service$)} = 0;
$nrconf{override_rc}->{qr(^isadoraair-monitoring\.service$)} = 0;
$nrconf{override_rc}->{qr(^isadoraair-gunicorn\.service$)} = 0;
$nrconf{override_rc}->{qr(^stereotool\.service$)} = 0;
