# Runtime Foundation E5 -- systemd-tmpfiles ownership for the two
# canonical, root-managed, persistent Foundation E system surfaces.
#
# These are the surfaces Foundation E3 (Kokoro/Piper generations) and
# Foundation E4 (fdkaac) publish INTO once provisioned; this file only
# establishes/repairs the containing directory itself (existence, mode,
# ownership) -- it never touches what's inside. Both are provisioning/
# root-managed and read/execute-only for application/service processes;
# neither is service-writable (see docs/RUNTIME_SYSTEM_SURFACES.md).
#
# Deliberately a SEPARATE file from the pre-existing deploy/isadoraair-
# tmpfiles.conf (which owns /run/isadoraair and its @@ISA_USER@@-owned
# /run/isadoraair/tts scratch directory -- an established, already-
# shipped, service-account-owned convention this file does not touch or
# duplicate). systemd-tmpfiles processes every *.conf under tmpfiles.d/
# independently, so the two files coexist without coordination.
#
# Installed by isadoraair.runtime_surfaces (Runtime Foundation E5) to:
#   /etc/tmpfiles.d/isadoraair-runtime.conf
#
# Both directories are always root-owned by Foundation E's own design,
# never a per-install service-account choice -- @@ISADORAAIR_SURFACE_UID@@
# / @@ISADORAAIR_SURFACE_GID@@ below are substituted with plain numeric
# 0/0 for the real canonical host (avoiding any username-resolution
# dependency entirely) and with the calling identity's own numeric
# uid/gid for a disposable, caller-owned --target-root install/test,
# matching every other Foundation E provisioner's non-canonical-root
# ownership convention. Never substituted with a symbolic name.
#
# See systemd-tmpfiles(8)/tmpfiles.d(5). Type "d": create the directory
# if missing, adjust mode/ownership if it already exists; never touches
# directory contents.
#
#Type Path Mode User Group Age
d /opt/isadoraair-runtime 0755 @@ISADORAAIR_SURFACE_UID@@ @@ISADORAAIR_SURFACE_GID@@ -
d /var/lib/isadoraair/tts 0755 @@ISADORAAIR_SURFACE_UID@@ @@ISADORAAIR_SURFACE_GID@@ -
