# Shared location blocks for the isadoraair virtual host -- `include`d from
# every HTTPS server block in deploy/isadoraair.nginx (and, on a station
# that also terminates a second HTTPS vhost for a public domain name /
# Let's Encrypt cert, from that block too -- see deploy/README.md's
# "Public HTTPS with your own domain" section). Any change to how requests
# are proxied belongs here, so every HTTPS vhost stays in sync rather than
# needing the same edit copy-pasted into each one.
#
# 2026-08-12 disaster-recovery Phase 2: this file used to exist only as a
# host-only /etc/nginx/snippets/isadoraair-locations.conf with no repo
# copy at all -- promoted into deploy/ here (genericized: the live
# station's copy uses a literal /opt/isadoraair, this one uses the
# @@ISA_ROOT@@ token like every other file in deploy/) so a fresh install
# starts from the same shape production actually runs, not a
# reconstruction of it after the fact.

client_max_body_size 1G;

location /static/ {
    alias @@ISA_ROOT@@/staticfiles/;
    expires 1h;
}

location /media/ {
    alias @@ISA_ROOT@@/media/;
    expires 1h;
}

# Remote DJ over WebRTC signaling (SDP/ICE JSON only -- the actual
# RTP/RTCP/DTLS-SRTP media never touches nginx, it's a separate direct
# UDP flow ICE establishes once signaling completes). Proxied to the
# signaling server's own port, separate from gunicorn's 8000.
location /ws/remote-dj/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # signaling socket sits open+idle for a whole DJ segment; default
    # 60s would kill it mid-session.
    proxy_read_timeout 3600s;
}

location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
